<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyberquiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
/* Arcade screen in the style of Boss AI: dark pixel city, HUD on top, one big panel. */
:root {
  color-scheme: dark;
  --night: #0d0816;
  --glass: rgba(20, 13, 33, 0.92);
  --slot: #1d1530;
  --edge: #3a2f55;
  --ink: #ece8f7;
  --muted: #a59bc4;
  --blood: #ff2246;
  --volt: #3ef0ff;
  --gold: #ffd23f;
  --lime: #b6e13a;
  --orange: #ff9a2e;
  --black: #000000;
  --f-display: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body: "Pixelify Sans", ui-monospace, "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--f-body); font-size: 18px; overflow: hidden; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 1px, transparent 1px 3px); }
.app {
  position: relative; z-index: 1; height: 100%;
  display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 16px;
  padding-block: 16px;
  padding-left: max(clamp(16px, 2.4vw, 40px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(16px, 2.4vw, 40px), env(safe-area-inset-right, 0px));
}

/* ---------- HUD ---------- */
.hud {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 20px;
  background: var(--glass); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--black); padding: 12px 18px;
}
.game-name { font-family: var(--f-display); font-size: clamp(13px, 1.25vw, 20px); color: var(--blood); text-shadow: 3px 3px 0 var(--black); }
.game-sub { font-size: 15px; color: var(--muted); margin-top: 6px; }
.track { display: flex; justify-content: center; gap: clamp(10px, 1.6vw, 26px); flex-wrap: wrap; }
.trk { display: grid; gap: 6px; justify-items: center; }
.trk-name { font-family: var(--f-display); font-size: 9px; color: var(--muted); letter-spacing: 0.05em; }
.trk.now .trk-name { color: var(--gold); }
.trk-pips { display: flex; gap: 3px; }
.trk-pip { width: 14px; height: 14px; background: var(--slot); border: 2px solid var(--edge); }
.trk-pip.done { background: var(--muted); border-color: var(--black); }
.trk-pip.now { background: var(--gold); border-color: var(--black); }
.hud-btn {
  font-family: var(--f-display); font-size: 10px; letter-spacing: 0.06em; padding: 10px 12px; cursor: pointer;
  background: var(--slot); color: var(--ink); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--black);
}
.hud-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--black); }
.hud-btn[hidden] { display: none; }

/* ---------- Panel ---------- */
.panel {
  background: var(--glass); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--black);
  padding: clamp(18px, 2.2vw, 34px); display: flex; flex-direction: column; gap: 20px; min-height: 0; overflow: auto;
}
.eyebrow { font-family: var(--f-display); font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 0; line-height: 1.6; }
.title { font-family: var(--f-display); font-size: clamp(26px, 3.2vw, 52px); line-height: 1.15; margin: 0; color: var(--blood); text-shadow: 5px 5px 0 var(--black); text-wrap: balance; }
.title.cool { color: var(--volt); }
.lede { font-size: clamp(19px, 1.5vw, 24px); line-height: 1.45; margin: 0; max-width: 46em; }
.note { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.4; }
.note strong { color: var(--gold); font-weight: 600; }
.qtext { font-size: clamp(24px, 2.2vw, 36px); line-height: 1.25; font-weight: 600; margin: 0; text-wrap: balance; }

.btn {
  font-family: var(--f-display); font-size: 13px; letter-spacing: 0.06em; padding: 15px 20px; cursor: pointer;
  background: var(--blood); color: var(--ink); border: 3px solid var(--black); box-shadow: 5px 5px 0 var(--black);
}
.btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--black); }
.btn.ghost { background: var(--slot); border-color: var(--edge); }
.btn.cool { background: #0f6e85; }
.btn:disabled { background: var(--slot); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: 5px 5px 0 var(--black); }
.actions { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
.actions .right { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; }

.step {
  width: 40px; height: 40px; font-family: var(--f-display); font-size: 16px; line-height: 1;
  background: var(--night); color: var(--ink); border: 3px solid var(--edge); cursor: pointer; box-shadow: 0 3px 0 var(--black); flex: none;
}
.step:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--black); }
.step:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.numin {
  width: 3.4ch; height: 40px; text-align: center; font-family: var(--f-display); font-size: 17px; color: var(--gold);
  background: var(--black); border: 3px solid var(--edge); padding: 0; -moz-appearance: textfield; appearance: textfield;
}
.numin::-webkit-outer-spin-button, .numin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.numin:focus { outline: 3px solid var(--volt); outline-offset: 0; }
.counter { display: inline-flex; align-items: center; gap: 5px; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }

/* ---------- Setup ---------- */
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.field { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--slot); border: 3px solid var(--edge); padding: 14px 16px; }
.field-label { font-size: 21px; font-weight: 600; }
.team-set { background: var(--slot); border: 3px solid var(--edge); border-top: 8px solid var(--tc); padding: 14px 16px; display: grid; gap: 12px; }
.team-set input[type=text] {
  width: 100%; font-family: var(--f-body); font-size: 21px; font-weight: 600; color: var(--ink);
  background: var(--black); border: 3px solid var(--edge); padding: 8px 10px;
}
.team-set .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.team-set .lbl { color: var(--muted); font-size: 17px; }

/* ---------- Rules ---------- */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.rule { background: var(--slot); border: 3px solid var(--edge); padding: 16px; display: grid; gap: 10px; align-content: start; }
.rule h3 { font-family: var(--f-display); font-size: 12px; color: var(--gold); margin: 0; line-height: 1.5; }
.rule p { margin: 0; font-size: 19px; line-height: 1.4; }
.bands { display: grid; gap: 6px; }
.band-row { display: flex; justify-content: space-between; gap: 10px; font-size: 18px; }
.band-row b { font-family: var(--f-display); font-size: 11px; color: var(--bc); }

/* ---------- Victim cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; }
.vcard {
  background: var(--slot); border: 3px solid var(--edge); border-top: 8px solid var(--tc);
  padding: 16px; display: grid; gap: 12px; align-content: start; position: relative;
}
.vcard .team { font-family: var(--f-display); font-size: 12px; color: var(--ti); line-height: 1.5; }
.vcard .who { display: flex; align-items: center; gap: 14px; }
.vcard .tag { font-family: var(--f-display); font-size: 10px; color: var(--muted); line-height: 1.6; }
.vcard .sit { font-size: 19px; line-height: 1.4; margin: 0; }
.avatar { width: 96px; height: 96px; image-rendering: pixelated; border: 3px solid var(--black); background: #2b2342; flex: none; }
.avatar.big { width: 132px; height: 132px; }
.verdict { font-family: var(--f-display); font-size: clamp(13px, 1.1vw, 17px); line-height: 1.5; color: var(--bc); text-shadow: 3px 3px 0 var(--black); }
.vcard.res { animation: dropin 0.6s steps(6) both; }
.vcard.truffata { border-color: var(--blood); }
.vcard.perfetto { box-shadow: 0 0 0 3px var(--lime); }
@keyframes dropin { from { transform: translateY(-24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .vcard.res { animation: none; } }

/* ---------- Question grid ---------- */
.vote-grid { display: grid; gap: 10px; }
.vrow { display: grid; align-items: center; gap: 12px; background: var(--slot); border: 3px solid var(--edge); padding: 10px 12px; }
.vrow.head { background: none; border: none; padding: 0 12px; }
.letter { font-family: var(--f-display); font-size: 15px; width: 40px; height: 40px; display: grid; place-items: center; background: var(--edge); }
.otext { font-size: clamp(18px, 1.5vw, 23px); line-height: 1.3; min-width: 0; }
.tcol { display: flex; justify-content: center; }
.thead { font-family: var(--f-display); font-size: 10px; color: var(--ti); text-align: center; line-height: 1.5; border-bottom: 5px solid var(--tc); padding-bottom: 6px; overflow-wrap: anywhere; }
.status-row .tcol { font-family: var(--f-display); font-size: 10px; line-height: 1.6; text-align: center; }
.ok { color: var(--lime); }
.warn { color: var(--orange); }

/* ---------- Recap ---------- */
.recap { display: grid; gap: 10px; }
.recap-item { background: var(--slot); border: 3px solid var(--edge); padding: 12px 14px; display: grid; gap: 6px; }
.recap-item .rq { font-size: 19px; font-weight: 600; }
.recap-item .ra { font-size: 19px; color: var(--lime); }
.recap-item .rs { font-size: 17px; color: var(--muted); line-height: 1.4; }

/* ---------- Leaderboard ---------- */
.board { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: clamp(18px, 1.5vw, 24px); }
.board th { font-family: var(--f-display); font-size: 10px; color: var(--muted); text-align: left; padding: 0 14px; font-weight: 400; letter-spacing: 0.05em; }
.board td { background: var(--slot); padding: 14px; border-top: 3px solid var(--edge); border-bottom: 3px solid var(--edge); }
.board td:first-child { border-left: 8px solid var(--tc); font-family: var(--f-display); font-size: 16px; color: var(--gold); }
.board td:last-child { border-right: 3px solid var(--edge); font-family: var(--f-display); color: var(--gold); font-size: clamp(14px, 1.3vw, 20px); }
.board .tn { color: var(--ti); font-weight: 700; }
.board .num, .board th.num { text-align: right; }
.board tr.first td { border-color: var(--gold); }

/* ---------- Credits ---------- */
.credits { position: fixed; inset: 0; z-index: 30; background: #050308; overflow: hidden; }
.credits[hidden] { display: none; }
.roll { position: absolute; left: 50%; top: 0; width: min(760px, calc(100% - 32px)); transform: translateX(-50%); text-align: center; padding: 100vh 0; }
.cr-h { font-family: var(--f-display); font-size: clamp(22px, 2.6vw, 40px); color: var(--blood); text-shadow: 4px 4px 0 var(--black); margin: 0 0 18px; line-height: 1.3; }
.cr-sub { font-size: 22px; color: var(--muted); margin: 0 0 22vh; }
.cr-team { font-family: var(--f-display); font-size: clamp(18px, 2vw, 30px); color: var(--ti); margin: 0 0 8px; line-height: 1.4; }
.cr-team-line { width: 120px; height: 6px; background: var(--tc); margin: 0 auto 12vh; }
.cr-v { display: grid; justify-items: center; gap: 12px; margin-bottom: 12vh; }
.cr-v .avatar { width: 150px; height: 150px; }
.cr-name { font-family: var(--f-display); font-size: clamp(16px, 1.6vw, 24px); color: var(--ink); line-height: 1.4; }
.cr-scam { font-family: var(--f-display); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; }
.cr-story { font-size: clamp(20px, 1.7vw, 26px); line-height: 1.45; margin: 0; max-width: 30em; }
.cr-meta { display: grid; gap: 6px; font-size: 20px; }
.cr-meta b { font-family: var(--f-display); font-size: 12px; color: var(--bc, var(--gold)); }
.cr-calc { font-family: var(--f-display); font-size: 13px; color: var(--gold); line-height: 1.6; }
.cr-total { font-family: var(--f-display); font-size: clamp(16px, 1.6vw, 24px); color: var(--gold); margin: 0 0 24vh; line-height: 1.6; }
.cr-end { font-family: var(--f-display); font-size: clamp(18px, 2vw, 28px); color: var(--volt); }
.cr-ctrl { position: fixed; right: 18px; bottom: 18px; z-index: 31; display: flex; gap: 10px; }
.cr-ctrl .btn { font-size: 11px; padding: 12px 14px; }

@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .hud { grid-template-columns: 1fr auto; }
  .track { grid-column: 1 / -1; grid-row: 2; }
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="hud">
    <div>
      <div class="game-name" id="gameName"></div>
      <div class="game-sub" id="gameSub"></div>
    </div>
    <div class="track" id="track"></div>
    <button class="hud-btn" id="pauseBtn" hidden>Pausa</button>
  </header>
  <main class="panel" id="panel" aria-live="polite"></main>
</div>

<div class="credits" id="credits" hidden>
  <div class="roll" id="roll"></div>
  <div class="cr-ctrl">
    <button class="btn ghost" id="crPlay">Pausa</button>
    <button class="btn ghost" id="crFast">Veloce</button>
    <button class="btn" id="crSkip">Classifica</button>
  </div>
</div>

<script src="content.js"></script>
<script>
(() => {
"use strict";

/* ===================== CONTENT ===================== */
const C = window.CYBERQUIZ || {};
const ROUNDS = C.round || [];
const VALORI = C.valori || {};
const VKEYS = ["enorme", "alto", "medio", "basso"];
const FASCE = (C.fasce || []).slice().sort((a, b) => b.min - a.min);
const LETTERS = ["A", "B", "C", "D"];
const SAVE_KEY = "cyberquiz_save_v1";
const TEAM_STYLE = [
  { name: "Squadra Viola",   col: "#9c2aa0", ink: "#dd86e3" },
  { name: "Squadra Azzurra", col: "#00b0ca", ink: "#5fdcee" },
  { name: "Squadra Gialla",  col: "#fecb00", ink: "#fecb00" },
  { name: "Squadra Lime",    col: "#a8b400", ink: "#cfdc3a" }
];
const BAND_COL = { perfetto: "var(--lime)", efficace: "var(--gold)", perdite: "var(--orange)", truffata: "var(--blood)" };

function contentErrors() {
  const e = [];
  if (ROUNDS.length < 1) e.push("Nessun round trovato in content.js.");
  ROUNDS.forEach((r, i) => {
    const vs = (r.vittime || []).map(v => v.valore).sort().join(",");
    if (vs !== VKEYS.slice().sort().join(",")) e.push(`Round ${i + 1}: servono 4 vittime, una per valore (enorme, alto, medio, basso).`);
    if (!(r.domande || []).length) e.push(`Round ${i + 1}: nessuna domanda.`);
    (r.domande || []).forEach((d, j) => {
      if ((d.options || []).length !== 4 || !(d.correct >= 0 && d.correct <= 3)) e.push(`Round ${i + 1}, domanda ${j + 1}: servono 4 risposte e una risposta giusta da 0 a 3.`);
    });
  });
  return e;
}

/* ===================== STATE & SAVE ===================== */
let S = freshSetup();
let view = "setup";          // setup | resume | game
let confirmNew = false;
let animResult = false;      // drop-in animation only when the round has just ended

function freshSetup(prev) {
  const teams = TEAM_STYLE.map((t, i) => ({ name: (prev && prev[i] && prev[i].name) || t.name, members: (prev && prev[i] && prev[i].members) || 25 }));
  return { phase: "setup", nTeams: prev ? prev.length : 4, teams, square: [], answers: [], ri: 0, qi: 0, recap: false, savedAt: 0 };
}
function save() {
  if (S.phase === "setup") return;
  S.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: play on */ }
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.teams) || !Array.isArray(s.answers) || s.answers.length !== ROUNDS.length) return null;
    for (let r = 0; r < ROUNDS.length; r++) if (!s.answers[r] || s.answers[r].length !== ROUNDS[r].domande.length) return null;
    return s;
  } catch (e) { return null; }
}

/* ===================== RANDOM FAIR COMBINATIONS ===================== */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// A random 4x4 Latin square: rows are teams, columns are rounds, symbols are stake values.
// Each team meets every value once, and in each round every team has a different value.
function latinSquare() {
  const p = shuffle([0, 1, 2, 3]), q = shuffle([0, 1, 2, 3]), s = shuffle(VKEYS.slice());
  const klein = Math.random() < 0.5;
  return p.map(i => q.map(j => s[klein ? (i ^ j) : (i + j) % 4]));
}

/* ===================== SCORING ===================== */
const teams = () => S.teams.slice(0, S.nTeams);
const victim = (t, r) => ROUNDS[r].vittime.find(v => v.valore === S.square[t][r]);
const fmt = n => Number(n).toLocaleString("it-IT", { maximumFractionDigits: 2 });
function correctVotes(t, r) {
  return ROUNDS[r].domande.reduce((sum, d, q) => sum + (S.answers[r][q][t][d.correct] || 0), 0);
}
function roundPct(t, r) {
  const m = S.teams[t].members, n = ROUNDS[r].domande.length;
  if (!m) return 0;
  return Math.min(100, Math.ceil(correctVotes(t, r) / (m * n) * 100 - 1e-9));
}
const fasciaOf = pct => FASCE.find(f => pct >= f.min) || FASCE[FASCE.length - 1];
function roundScore(t, r) {
  const pct = roundPct(t, r), f = fasciaOf(pct), v = VALORI[S.square[t][r]] || { mult: 1 };
  return { pct, f, v, pts: f.mult ? Math.round(pct * v.mult * f.mult) : 0 };
}
function teamSummary(t) {
  let pts = 0, saved = 0, corr = 0, tot = 0;
  ROUNDS.forEach((r, ri) => {
    const s = roundScore(t, ri);
    pts += s.pts; if (s.f.mult > 0) saved++;
    corr += correctVotes(t, ri); tot += S.teams[t].members * r.domande.length;
  });
  return { pts, saved, avg: tot ? Math.round(corr / tot * 100) : 0 };
}

/* ===================== PIXEL HELPERS ===================== */
let g;
function rng(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const P = (x, y, c) => R(x, y, 1, 1, c);
function hash(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }

/* ===================== AVATARS ===================== */
// 24x24 pixel portraits generated from the victim's name. During the game they are shown as a mosaic.
const AV = 24;
const SKINS = [["#f6d3b3", "#d9a988"], ["#e8b48f", "#c48a66"], ["#c98e62", "#a06a43"], ["#8d5a3b", "#6b4029"], ["#f1c7a0", "#cf9c78"]];
const HAIRS = ["#2a1a12", "#5a3418", "#a8642a", "#e2b552", "#141016", "#7a2a1e"];
const SHIRTS = ["#2f6bff", "#ff2246", "#3ef0ff", "#ffd23f", "#9c2aa0", "#a8b400", "#eb9700", "#ece8f7", "#007c92"];
function avatarGrid(v) {
  const r = rng(hash(v.nome + "|" + v.eta));
  const pick = a => a[Math.floor(r() * a.length)];
  const G = Array.from({ length: AV }, () => new Array(AV).fill(null));
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < AV && y < AV) G[y][x] = c; };
  const [skin, skinD] = pick(SKINS);
  const old = v.eta >= 55;
  const hair = old ? (r() < 0.5 ? "#c9c6d4" : "#8f8b9c") : pick(HAIRS);
  const shirt = pick(SHIRTS);
  const style = old ? pick(["short", "bald", "bun", "short"]) : pick(["short", "long", "bun", "long", "short", "spiky"]);
  const glasses = r() < (old ? 0.65 : 0.25);
  const ell = (cx, cy, rx, ry, x, y) => ((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2 <= 1;
  // long hair behind the head
  if (style === "long") for (let y = 6; y < 19; y++) for (let x = 5; x < 19; x++) if (ell(12, 12, 7.2, 9, x, y)) set(x, y, hair);
  // shirt
  for (let y = 18; y < AV; y++) { const w = 6 + (y - 18) * 1.2; for (let x = Math.round(12 - w); x < Math.round(12 + w); x++) set(x, y, shirt); }
  for (let x = 10; x < 14; x++) set(x, 18, skin);
  // neck
  for (let y = 15; y < 19; y++) for (let x = 10; x < 14; x++) set(x, y, y === 15 ? skinD : skin);
  // head
  for (let y = 2; y < 18; y++) for (let x = 4; x < 20; x++) if (ell(12, 10, 6, 7, x, y)) set(x, y, skin);
  set(5, 10, skinD); set(18, 10, skinD);
  // hair on top
  if (style !== "bald") {
    for (let y = 1; y < 9; y++) for (let x = 4; x < 20; x++)
      if (ell(12, 9, 6.6, 7.4, x, y) && (y < 6 || x < 7 || x > 16)) set(x, y, hair);
    if (style === "bun") for (let y = 0; y < 4; y++) for (let x = 9; x < 15; x++) if (ell(12, 1.6, 2.8, 2, x, y)) set(x, y, hair);
    if (style === "spiky") [[7, 1], [10, 0], [13, 0], [16, 1]].forEach(([x, y]) => { set(x, y, hair); set(x + 1, y, hair); });
  } else {
    for (let y = 7; y < 11; y++) { set(5, y, hair); set(6, y, hair); set(17, y, hair); set(18, y, hair); }
  }
  // face
  const eye = "#1a1222";
  set(9, 10, eye); set(14, 10, eye);
  set(9, 9, skinD); set(14, 9, skinD);
  set(11, 13, skinD); set(12, 13, skinD);
  set(10, 14, "#9a3b44"); set(11, 14, "#9a3b44"); set(12, 14, "#9a3b44"); set(13, 14, "#9a3b44");
  if (glasses) {
    const gc = "#0e0a16";
    [[7, 9], [8, 9], [9, 9], [10, 9], [13, 9], [14, 9], [15, 9], [16, 9], [7, 11], [8, 11], [9, 11], [10, 11], [13, 11], [14, 11], [15, 11], [16, 11],
     [7, 10], [10, 10], [13, 10], [16, 10], [11, 10], [12, 10]].forEach(([x, y]) => set(x, y, gc));
  }
  // outline
  const out = G.map(row => row.slice());
  for (let y = 0; y < AV; y++) for (let x = 0; x < AV; x++) {
    if (G[y][x]) continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => G[y + dy] && G[y + dy][x + dx])) out[y][x] = "#0e0a16";
  }
  return out;
}
function avatarCanvas(v, censored, cls) {
  const c = document.createElement("canvas");
  c.width = AV; c.height = AV; c.className = "avatar" + (cls ? " " + cls : "");
  g = c.getContext("2d");
  R(0, 0, AV, AV, "#2b2342");
  const G = avatarGrid(v);
  if (!censored) {
    G.forEach((row, y) => row.forEach((col, x) => { if (col) P(x, y, col); }));
  } else {
    const B = 4;
    for (let by = 0; by < AV; by += B) for (let bx = 0; bx < AV; bx += B) {
      const counts = {};
      for (let y = by; y < by + B; y++) for (let x = bx; x < bx + B; x++) { const k = G[y][x] || "#2b2342"; counts[k] = (counts[k] || 0) + 1; }
      const col = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
      R(bx, by, B, B, col);
    }
    R(9, 8, 6, 9, "rgba(5,3,8,0.78)");
    g.fillStyle = "#ffd23f";
    [[11, 9], [12, 9], [13, 10], [12, 11], [12, 12], [12, 14]].forEach(([x, y]) => P(x, y, "#ffd23f"));
  }
  c.setAttribute("role", "img");
  c.setAttribute("aria-label", censored ? "Ritratto nascosto per privacy" : `Ritratto di ${v.nome}`);
  return c;
}

/* ===================== BACKGROUND (from Boss AI) ===================== */
const bg = document.getElementById("bg"), bctx = bg.getContext("2d");
let BW = 0, BH = 0, city = [], stars = [], tick = 0;
function sizeBg() {
  BW = Math.ceil(innerWidth / 4); BH = Math.ceil(innerHeight / 4);
  bg.width = BW; bg.height = BH;
  const r = rng(42);
  city = []; stars = [];
  for (const layer of [0, 1]) {
    let x = -3;
    while (x < BW) {
      const w = 6 + Math.floor(r() * 14);
      const h = Math.floor(BH * (layer ? 0.1 + r() * 0.24 : 0.2 + r() * 0.26));
      const wins = [];
      if (layer) for (let wy = BH - h + 3; wy < BH - 2; wy += 3)
        for (let wx = x + 2; wx < x + w - 2; wx += 3)
          if (r() < 0.35) wins.push([wx, wy, r() < 0.3 ? "#ff2246" : "#ffd23f", r() * 100]);
      city.push({ layer, x, w, h, wins, ant: r() < 0.25 });
      x += w + (r() < 0.3 ? 1 : 0);
    }
  }
  for (let i = 0; i < BW * BH / 260; i++) stars.push([Math.floor(r() * BW), Math.floor(r() * BH * 0.55), r() * 100]);
}
function drawBg() {
  g = bctx;
  const bands = ["#0b0716", "#120a1d", "#1a0c22", "#250e24", "#341224", "#461522"];
  const bh = BH / bands.length;
  bands.forEach((c, i) => R(0, Math.floor(i * bh), BW, Math.ceil(bh) + 1, c));
  for (let i = 1; i < bands.length; i++) {
    const y = Math.floor(i * bh);
    for (let x = 0; x < BW; x++) { if (x % 2 === 0) P(x, y - 1, bands[i]); else P(x, y, bands[i - 1]); }
  }
  for (const [x, y, ph] of stars) if ((Math.floor(tick / 6 + ph) % 9) !== 0) P(x, y, "#5d5277");
  for (const b of city) {
    const c = b.layer ? "#07040c" : "#170e22";
    R(b.x, BH - b.h, b.w, b.h, c);
    if (b.ant) {
      R(b.x + Math.floor(b.w / 2), BH - b.h - 4, 1, 4, c);
      if (b.layer && tick % 12 < 6) P(b.x + Math.floor(b.w / 2), BH - b.h - 5, "#ff2246");
    }
    for (const [wx, wy, wc, ph] of b.wins) if ((Math.floor(tick / 8 + ph) % 13) !== 0) P(wx, wy, wc);
  }
}

function stepCredits(dt) {
  if (!crOn || crPaused) return;
  crY += dt * 0.09 * crSpeed;
  const max = roll.scrollHeight - innerHeight * 0.55;
  if (crY >= max) { crY = max; closeCredits(); return; }
  roll.style.transform = `translate(-50%, ${-crY}px)`;
}
$("crPlay").addEventListener("click", () => { crPaused = !crPaused; $("crPlay").textContent = crPaused ? "Riparti" : "Pausa"; });
$("crFast").addEventListener("click", () => { crSpeed = crSpeed === 1 ? 3 : 1; $("crFast").textContent = crSpeed === 1 ? "Veloce" : "Normale"; });
$("crSkip").addEventListener("click", closeCredits);
addEventListener("keydown", e => { if (crOn && e.key === " ") { e.preventDefault(); $("crPlay").click(); } });

/* ===================== ACTIONS ===================== */
function startGame() {
  const T = S.teams.map(t => ({ name: (t.name || "").trim() || "Squadra", members: Math.max(1, t.members | 0) }));
  S = {
    phase: "intro", nTeams: S.nTeams, teams: T,
    square: latinSquare().slice(0, S.nTeams),
    answers: ROUNDS.map(r => r.domande.map(() => Array.from({ length: S.nTeams }, () => [0, 0, 0, 0]))),
    ri: 0, qi: 0, recap: false, savedAt: 0
  };
  view = "game"; save(); render();
}
function go(phase, patch) { Object.assign(S, patch || {}, { phase }); save(); render(); panel.scrollTop = 0; }
function setVote(t, o, val) {
  const a = cell(t), others = a.reduce((x, y, i) => x + (i === o ? 0 : y), 0);
  a[o] = Math.max(0, Math.min(S.teams[t].members - others, val | 0));
  save(); updateVotes();
}

panel.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act, t = +b.dataset.t, o = +b.dataset.o;
  switch (act) {
    case "nt-": S.nTeams = Math.max(1, S.nTeams - 1); render(); break;
    case "nt+": S.nTeams = Math.min(4, S.nTeams + 1); render(); break;
    case "m-": S.teams[t].members = Math.max(1, S.teams[t].members - 1); render(); panel.querySelector(`[data-act="m-"][data-t="${t}"]`)?.focus(); break;
    case "m+": S.teams[t].members = Math.min(200, S.teams[t].members + 1); render(); panel.querySelector(`[data-act="m+"][data-t="${t}"]`)?.focus(); break;
    case "start": startGame(); break;
    case "toResume": confirmNew = false; view = "resume"; render(); break;
    case "resume": { const s = loadSave(); if (s) { S = s; view = "game"; if (S.phase === "credits") S.phase = "final"; render(); } break; }
    case "new":
      if (!confirmNew) { confirmNew = true; render(); break; }
      confirmNew = false; { const s = loadSave(); S = freshSetup(s ? s.teams.slice(0, s.nTeams) : null); } view = "setup"; render(); break;
    case "toRound": go("roundIntro", { ri: 0, qi: 0 }); break;
    case "backFromIntro": S.ri === 0 ? go("intro") : go("roundResult", { ri: S.ri - 1, recap: false }); break;
    case "toQuestion": go("question", { qi: 0 }); break;
    case "v+": setVote(t, o, cell(t)[o] + 1); break;
    case "v-": setVote(t, o, cell(t)[o] - 1); break;
    case "qPrev": S.qi === 0 ? go("roundIntro") : go("question", { qi: S.qi - 1 }); break;
    case "qNext": S.qi < ROUNDS[S.ri].domande.length - 1 ? go("question", { qi: S.qi + 1 }) : (animResult = true, go("roundResult", { recap: false })); break;
    case "backToQ": go("question", { qi: ROUNDS[S.ri].domande.length - 1 }); break;
    case "recap": S.recap = !S.recap; save(); render(); break;
    case "nextRound":
      if (S.ri < ROUNDS.length - 1) go("roundIntro", { ri: S.ri + 1, qi: 0, recap: false });
      else { S.phase = "credits"; save(); renderTrack(); openCredits(); }
      break;
    case "replayCredits": openCredits(); break;
    case "again": S = freshSetup(teams()); view = "setup"; render(); break;
  }
});
panel.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.name !== undefined) { S.teams[+el.dataset.name].name = el.value; return; }
});
panel.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.mem !== undefined) { S.teams[+el.dataset.mem].members = Math.max(1, Math.min(200, parseInt(el.value, 10) || 1)); render(); }
  else if (el.dataset.vt !== undefined) { setVote(+el.dataset.vt, +el.dataset.vo, parseInt(el.value, 10) || 0); el.value = cell(+el.dataset.vt)[+el.dataset.vo]; }
});
panel.addEventListener("focusin", e => { if (e.target.classList.contains("numin") && e.target.select) e.target.select(); });
panel.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("numin")) e.target.blur(); });
$("pauseBtn").addEventListener("click", () => { save(); confirmNew = false; view = "resume"; render(); });

/* ===================== LOOP ===================== */
function resize() { sizeBg(); drawBg(); }
addEventListener("resize", resize);
let last = 0, lastFrame = 0;
function loop(now) {
  const dt = lastFrame ? Math.min(64, now - lastFrame) : 16; lastFrame = now;
  stepCredits(dt);
  if (now - last >= 1000 / 12) { last = now; tick++; if (tick % 3 === 0 && !crOn) drawBg(); }
  requestAnimationFrame(loop);
}
if (loadSave()) view = "resume";
resize(); render();
requestAnimationFrame(loop);
})();
</script>
</body>
