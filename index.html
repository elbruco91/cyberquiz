<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyberquiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap">
<style>
/* Arcade screen in the style of Boss AI. Sized on the viewport height so a
   whole screen (question + options + team counters) fits a 16:9 projector. */
:root {
  color-scheme: dark;
  --night: #0d0816;
  --glass: rgba(20, 13, 33, 0.93);
  --slot: #1d1530;
  --edge: #3a2f55;
  --ink: #ece8f7;
  --muted: #a59bc4;
  --blood: #ff2246;
  --volt: #3ef0ff;
  --gold: #ffd23f;
  --lime: #b6e13a;
  --green: #2fd26b;
  --orange: #ff9a2e;
  --black: #000000;
  --f-display: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body: "Pixelify Sans", ui-monospace, "Courier New", monospace;
  --u: min(1vh, 0.5625vw);   /* 1% of the height of a 16:9 frame that fits the window */
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--f-body); font-size: calc(var(--u) * 2.2); overflow: hidden; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.14) 0 1px, transparent 1px 3px); }
.app {
  position: relative; z-index: 1; height: 100%;
  display: grid; grid-template-rows: auto minmax(0, 1fr); gap: calc(var(--u) * 1.6);
  padding: calc(var(--u) * 1.8) max(calc(var(--u) * 2.6), 16px);
}

/* ---------- HUD ---------- */
.hud {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: calc(var(--u) * 2.4);
  background: var(--glass); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--black);
  padding: calc(var(--u) * 1.1) calc(var(--u) * 2);
}
.game-name { font-family: var(--f-display); font-size: calc(var(--u) * 1.9); color: var(--blood); text-shadow: 3px 3px 0 var(--black); }
.game-sub { font-size: calc(var(--u) * 1.6); color: var(--muted); margin-top: calc(var(--u) * 0.6); }
.track { display: flex; justify-content: center; gap: calc(var(--u) * 2.4); flex-wrap: wrap; }
.trk { display: grid; gap: calc(var(--u) * 0.6); justify-items: center; }
.trk-name { font-family: var(--f-display); font-size: calc(var(--u) * 0.95); color: var(--muted); letter-spacing: 0.05em; white-space: nowrap; }
.trk-name b { color: var(--gold); font-weight: 400; }
.trk.now .trk-name { color: var(--ink); }
.trk-pips { display: flex; gap: 3px; }
.trk-pip { width: calc(var(--u) * 1.4); height: calc(var(--u) * 1.4); background: var(--slot); border: 2px solid var(--edge); }
.trk-pip.done { background: var(--muted); border-color: var(--black); }
.trk-pip.now { background: var(--gold); border-color: var(--black); }
.hud-btn {
  font-family: var(--f-display); font-size: calc(var(--u) * 1.05); letter-spacing: 0.06em; padding: calc(var(--u) * 1.1) calc(var(--u) * 1.3); cursor: pointer;
  background: var(--slot); color: var(--ink); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--black);
}
.hud-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--black); }
.hud-btn[hidden] { display: none; }
.app.bare .hud { display: none; }
.app.bare { grid-template-rows: minmax(0, 1fr); }

/* ---------- Panel ---------- */
.panel {
  background: var(--glass); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--black);
  padding: calc(var(--u) * 2.6) calc(var(--u) * 3.2); display: flex; flex-direction: column; gap: calc(var(--u) * 1.9); min-height: 0; overflow: auto;
}
.eyebrow { font-family: var(--f-display); font-size: calc(var(--u) * 1.15); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 0; line-height: 1.6; }
.title { font-family: var(--f-display); font-size: calc(var(--u) * 4.6); line-height: 1.15; margin: 0; color: var(--blood); text-shadow: 5px 5px 0 var(--black); text-wrap: balance; }
.title.cool { color: var(--volt); }
.lede { font-size: calc(var(--u) * 2.5); line-height: 1.4; margin: 0; max-width: 52em; }
.note { margin: 0; color: var(--muted); font-size: calc(var(--u) * 1.9); line-height: 1.4; }
.note strong { color: var(--gold); font-weight: 600; }
.qtext { font-size: calc(var(--u) * 3.3); line-height: 1.22; font-weight: 600; margin: 0; text-wrap: balance; }

.btn {
  font-family: var(--f-display); font-size: calc(var(--u) * 1.4); letter-spacing: 0.06em; padding: calc(var(--u) * 1.5) calc(var(--u) * 2.1); cursor: pointer;
  background: var(--blood); color: var(--ink); border: 3px solid var(--black); box-shadow: 5px 5px 0 var(--black);
}
.btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--black); }
.btn.ghost { background: var(--slot); border-color: var(--edge); }
.btn.go { background: #138a45; }
.btn.big { font-size: calc(var(--u) * 2); padding: calc(var(--u) * 2.2) calc(var(--u) * 3.2); min-width: calc(var(--u) * 42); }
.btn:disabled { background: var(--slot); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: 5px 5px 0 var(--black); }
.actions { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 1.4); flex-wrap: wrap; margin-top: auto; }
.actions .right { display: flex; gap: calc(var(--u) * 1.4); flex-wrap: wrap; margin-left: auto; align-items: center; }

.step {
  width: calc(var(--u) * 4.2); height: calc(var(--u) * 4.2); font-family: var(--f-display); font-size: calc(var(--u) * 1.6); line-height: 1; padding: 0;
  background: var(--night); color: var(--ink); border: 3px solid var(--edge); cursor: pointer; box-shadow: 0 3px 0 var(--black); flex: none;
}
.step:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--black); }
.step:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.numin {
  width: calc(var(--u) * 6); height: calc(var(--u) * 4.2); text-align: center; font-family: var(--f-display); font-size: calc(var(--u) * 1.7); color: var(--gold);
  background: var(--black); border: 3px solid var(--edge); padding: 0; -moz-appearance: textfield; appearance: textfield;
}
.numin::-webkit-outer-spin-button, .numin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.numin:focus { outline: 3px solid var(--volt); outline-offset: 0; }
.counter { display: inline-flex; align-items: center; gap: calc(var(--u) * 0.5); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }

/* ---------- Menu ---------- */
.menu { display: grid; place-items: center; align-content: center; gap: calc(var(--u) * 3.2); text-align: center; flex: 1; }
.menu .logo { font-family: var(--f-display); font-size: calc(var(--u) * 7.2); color: var(--blood); text-shadow: 7px 7px 0 var(--black); margin: 0; line-height: 1.15; }
.menu .tag { font-size: calc(var(--u) * 2.6); color: var(--muted); margin: 0; }
.menu .faces { display: flex; gap: calc(var(--u) * 1.6); justify-content: center; }
.menu .faces .avatar { width: calc(var(--u) * 11); height: calc(var(--u) * 11); }
.menu .stack { display: grid; gap: calc(var(--u) * 1.8); justify-items: center; }
.menu .saved { font-size: calc(var(--u) * 1.9); color: var(--muted); margin: 0; }

/* ---------- Setup ---------- */
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(var(--u) * 30), 1fr)); gap: calc(var(--u) * 1.4); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--slot); border: 3px solid var(--edge); padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6); }
.field-label { font-size: calc(var(--u) * 2.4); font-weight: 600; }
.team-set { background: var(--slot); border: 3px solid var(--edge); border-top: 8px solid var(--tc); padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6); display: grid; gap: calc(var(--u) * 1.2); }
.team-set input[type=text] {
  width: 100%; font-family: var(--f-body); font-size: calc(var(--u) * 2.4); font-weight: 600; color: var(--ink);
  background: var(--black); border: 3px solid var(--edge); padding: calc(var(--u) * 0.8) calc(var(--u) * 1);
}
.team-set .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.team-set .lbl { color: var(--muted); font-size: calc(var(--u) * 2); }
.warnline { color: var(--orange); font-size: calc(var(--u) * 1.9); margin: 0; }

/* ---------- Rules ---------- */
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * 1.6); }
.rule { background: var(--slot); border: 3px solid var(--edge); padding: calc(var(--u) * 1.8); display: grid; gap: calc(var(--u) * 1.1); align-content: start; }
.rule h3 { font-family: var(--f-display); font-size: calc(var(--u) * 1.3); color: var(--gold); margin: 0; line-height: 1.5; }
.rule p { margin: 0; font-size: calc(var(--u) * 2.15); line-height: 1.38; }
.bands { display: grid; gap: calc(var(--u) * 0.7); }
.band-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: calc(var(--u) * 2); }
.band-row b { font-family: var(--f-display); font-size: calc(var(--u) * 1.05); color: var(--bc); line-height: 1.5; }
.band-row span { white-space: nowrap; }

/* ---------- Victim cards ---------- */
.cards { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: calc(var(--u) * 1.6); }
.vcard {
  background: var(--slot); border: 3px solid var(--edge); border-top: 8px solid var(--tc);
  padding: calc(var(--u) * 1.7); display: grid; gap: calc(var(--u) * 1.2); align-content: start; position: relative;
}
.vcard .team { font-family: var(--f-display); font-size: calc(var(--u) * 1.25); color: var(--ti); line-height: 1.5; }
.vcard .who { display: flex; align-items: center; gap: calc(var(--u) * 1.4); }
.vcard .vname { font-family: var(--f-display); font-size: calc(var(--u) * 1.6); line-height: 1.5; color: var(--ink); }
.vcard .sit { font-size: calc(var(--u) * 2.15); line-height: 1.38; margin: 0; }
.avatar { width: calc(var(--u) * 12); height: calc(var(--u) * 12); image-rendering: pixelated; border: 3px solid var(--black); flex: none; }
.verdict { font-family: var(--f-display); font-size: calc(var(--u) * 1.5); line-height: 1.5; color: var(--bc); text-shadow: 3px 3px 0 var(--black); }
.calc { font-family: var(--f-display); font-size: calc(var(--u) * 1.15); color: var(--muted); line-height: 1.7; }
.calc b { color: var(--gold); font-weight: 400; font-size: calc(var(--u) * 2); display: block; }
.vcard.anim { animation: dropin 0.6s steps(6) both; }
.vcard.fallito { border-color: var(--blood); border-top-color: var(--tc); }
.vcard.perfetto { box-shadow: 0 0 0 3px var(--lime); }
@keyframes dropin { from { transform: translateY(-24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Question grid ---------- */
.vote-grid { display: grid; gap: calc(var(--u) * 0.9); }
.vrow { display: grid; align-items: center; gap: calc(var(--u) * 1.2); background: var(--slot); border: 3px solid var(--edge); padding: calc(var(--u) * 0.8) calc(var(--u) * 1.1); }
.vrow.head { background: none; border: none; padding: 0 calc(var(--u) * 1.1); }
.letter { font-family: var(--f-display); font-size: calc(var(--u) * 1.6); width: calc(var(--u) * 4.2); height: calc(var(--u) * 4.2); display: grid; place-items: center; background: var(--edge); }
.otext { font-size: calc(var(--u) * 2.35); line-height: 1.25; min-width: 0; }
.tcol { display: flex; justify-content: center; }
.thead { font-family: var(--f-display); font-size: calc(var(--u) * 1.05); color: var(--ti); text-align: center; line-height: 1.5; border-bottom: 5px solid var(--tc); padding-bottom: calc(var(--u) * 0.6); overflow-wrap: anywhere; }
.status-row .tcol { font-family: var(--f-display); font-size: calc(var(--u) * 1.05); line-height: 1.6; text-align: center; }
.ok { color: var(--lime); }
.warn { color: var(--orange); }
/* reveal */
.vrow.right { background: #0f3b22; border-color: var(--green); box-shadow: 0 0 0 3px var(--green), 0 0 calc(var(--u) * 3) rgba(47, 210, 107, 0.55); animation: glow 1.2s steps(6) 2; }
.vrow.right .letter { background: var(--green); color: var(--black); }
.vrow.wrong { opacity: 0.45; }
@keyframes glow { 50% { box-shadow: 0 0 0 5px var(--green), 0 0 calc(var(--u) * 5) rgba(47, 210, 107, 0.85); } }
.vcount { font-family: var(--f-display); font-size: calc(var(--u) * 1.9); color: var(--ink); min-width: calc(var(--u) * 6); text-align: center; }
.vrow.right .vcount { color: var(--gold); }
.res-row .tcol { display: grid; justify-items: center; gap: calc(var(--u) * 0.5); }
.res-pct { font-family: var(--f-display); font-size: calc(var(--u) * 2.6); color: var(--gold); text-shadow: 3px 3px 0 var(--black); }
.res-n { font-family: var(--f-display); font-size: calc(var(--u) * 1.05); color: var(--muted); }

/* ---------- Leaderboard ---------- */
.board { width: 100%; border-collapse: separate; border-spacing: 0 calc(var(--u) * 0.9); font-size: calc(var(--u) * 2.5); }
.board th { font-family: var(--f-display); font-size: calc(var(--u) * 1.05); color: var(--muted); text-align: left; padding: 0 calc(var(--u) * 1.5); font-weight: 400; letter-spacing: 0.05em; }
.board td { background: var(--slot); padding: calc(var(--u) * 1.5); border-top: 3px solid var(--edge); border-bottom: 3px solid var(--edge); }
.board td:first-child { border-left: 8px solid var(--tc); font-family: var(--f-display); font-size: calc(var(--u) * 1.8); color: var(--gold); }
.board td:last-child { border-right: 3px solid var(--edge); font-family: var(--f-display); color: var(--gold); font-size: calc(var(--u) * 2.2); }
.board .tn { color: var(--ti); font-weight: 700; }
.board .num, .board th.num { text-align: right; }
.board tr.first td { border-color: var(--gold); }
.board.small { font-size: calc(var(--u) * 2); border-spacing: 0 calc(var(--u) * 0.6); }
.board.small td { padding: calc(var(--u) * 0.9) calc(var(--u) * 1.4); }
.board.small td:last-child { font-size: calc(var(--u) * 1.7); }
.board.small td:first-child { font-size: calc(var(--u) * 1.4); }

/* result screen: cards + standings must share one 16:9 screen */
.panel.result { gap: calc(var(--u) * 1.4); }
.panel.result .title { font-size: calc(var(--u) * 3.4); }
.panel.result .avatar { width: calc(var(--u) * 8); height: calc(var(--u) * 8); }
.panel.result .vcard { gap: calc(var(--u) * 0.9); padding: calc(var(--u) * 1.4); }
.panel.result .sit { font-size: calc(var(--u) * 1.95); }
.panel.result .board.small { border-spacing: 0 calc(var(--u) * 0.45); }
.panel.result .board.small td { padding: calc(var(--u) * 0.55) calc(var(--u) * 1.4); }
/* setup screen: roomier, bigger type, team boxes fill the free height */
.panel.setup { gap: calc(var(--u) * 2.6); padding: calc(var(--u) * 3.4) calc(var(--u) * 4); }
.panel.setup .title { font-size: calc(var(--u) * 5.4); }
.panel.setup .lede { font-size: calc(var(--u) * 2.9); font-weight: 600; line-height: 1.45; }
.panel.setup .field { padding: calc(var(--u) * 2.2) calc(var(--u) * 2.6); }
.panel.setup .field-label { font-size: calc(var(--u) * 3.2); }
.panel.setup .step { width: calc(var(--u) * 6.2); height: calc(var(--u) * 6.2); font-size: calc(var(--u) * 2.4); }
.panel.setup .numin { width: calc(var(--u) * 9); height: calc(var(--u) * 6.2); font-size: calc(var(--u) * 2.6); }
.panel.setup .counter { gap: calc(var(--u) * 0.9); }
.panel.setup .setup-grid { flex: 1; min-height: 0; gap: calc(var(--u) * 2.2); grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); }
.panel.setup .team-set { border-top-width: calc(var(--u) * 1.4); padding: calc(var(--u) * 2.6) calc(var(--u) * 2.6); gap: calc(var(--u) * 2); align-content: center; }
.panel.setup .team-set input[type=text] { font-size: calc(var(--u) * 3); padding: calc(var(--u) * 1.4) calc(var(--u) * 1.6); }
.panel.setup .team-set .lbl { font-family: var(--f-display); font-size: calc(var(--u) * 1.4); color: var(--ti, var(--muted)); letter-spacing: 0.06em; text-transform: uppercase; }
.panel.setup .team-set .row { flex-direction: column; align-items: stretch; gap: calc(var(--u) * 1.2); }
.panel.setup .team-set .row .lbl { color: var(--muted); }
.panel.setup .team-set .row .counter { justify-content: space-between; }
.panel.setup .team-set .row .numin { flex: 1; width: auto; }
.panel.setup .btn { font-size: calc(var(--u) * 1.7); padding: calc(var(--u) * 1.9) calc(var(--u) * 2.6); }
.panel.setup .warnline { font-size: calc(var(--u) * 2.2); }
@media (prefers-reduced-motion: reduce) { .vcard.anim, .vrow.right { animation: none; } }
@media (max-aspect-ratio: 4/3) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .rules, .cards { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="hud">
    <div>
      <div class="game-name" id="gameName"></div>
      <div class="game-sub" id="gameSub"></div>
    </div>
    <div class="track" id="track"></div>
    <button class="hud-btn" id="pauseBtn" hidden>Pausa</button>
  </header>
  <main class="panel" id="panel" aria-live="polite"></main>
</div>

<script src="content.js"></script>
<script>
(() => {
"use strict";

/* ===================== CONTENT ===================== */
const C = window.CYBERQUIZ || {};
const ROUNDS = C.round || [];
const FASCE = (C.fasce || []).slice().sort((a, b) => b.min - a.min);
const LETTERS = ["A", "B", "C", "D"];
const SAVE_KEY = "cyberquiz_save_v3";
const TEAM_STYLE = [
  { name: "Squadra Viola",   col: "#9c2aa0", ink: "#dd86e3" },
  { name: "Squadra Azzurra", col: "#00b0ca", ink: "#5fdcee" },
  { name: "Squadra Gialla",  col: "#fecb00", ink: "#fecb00" },
  { name: "Squadra Lime",    col: "#a8b400", ink: "#cfdc3a" }
];
const BAND_COL = { perfetto: "var(--lime)", efficace: "var(--gold)", mid: "var(--orange)", pelo: "#ff6a3d", fallito: "var(--blood)" };

function contentErrors() {
  const e = [];
  if (ROUNDS.length < 1) e.push("Nessun round trovato in content.js.");
  ROUNDS.forEach((r, i) => {
    if ((r.vittime || []).length < 4) e.push(`Round ${i + 1}: servono 4 vittime, una per squadra.`);
    if (!(r.domande || []).length) e.push(`Round ${i + 1}: nessuna domanda.`);
    (r.domande || []).forEach((d, j) => {
      const n = (d.options || []).length;
      if (n < 2 || n > 4 || !(d.correct >= 0 && d.correct < n)) e.push(`Round ${i + 1}, domanda ${j + 1}: servono da 2 a 4 risposte e una risposta giusta valida (0 = A, 1 = B...).`);
    });
  });
  return e;
}

/* ===================== STATE & SAVE ===================== */
let S = freshSetup();
let view = "menu";           // menu | setup | game
let animCards = false;       // drop-in animation only when a round has just ended

function freshSetup(prev) {
  const teams = TEAM_STYLE.map((t, i) => ({ name: (prev && prev[i] && prev[i].name) || t.name, members: (prev && prev[i] && prev[i].members) || 25 }));
  return { phase: "setup", nTeams: prev ? prev.length : 4, teams, assign: [], answers: [], ri: 0, qi: 0, savedAt: 0 };
}
function save() {
  if (S.phase === "setup") return;
  S.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: play on */ }
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.teams) || !Array.isArray(s.answers) || s.answers.length !== ROUNDS.length) return null;
    for (let r = 0; r < ROUNDS.length; r++) if (!s.answers[r] || s.answers[r].length !== ROUNDS[r].domande.length) return null;
    return s;
  } catch (e) { return null; }
}
const unfinished = () => { const s = loadSave(); return s && s.phase !== "final" ? s : null; };

/* ===================== SCORING ===================== */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const teams = () => S.teams.slice(0, S.nTeams);

let g;

/* ===================== AVATARS ===================== */
// 32x32 pixel portraits generated from the victim's name: shaded face, eyes with
// highlights, brows, nose, mouth, hair style, clothes with collar and a backdrop.
const AV = 32;
const SKINS = [
  ["#ffe0c4", "#f2c19e", "#d99a74"], ["#f4c8a0", "#e0a77c", "#bf8059"],
  ["#d9a275", "#c08657", "#9a643c"], ["#a8714a", "#8c5a37", "#6b4027"], ["#7a4b2f", "#633b23", "#4a2a18"]
];
const HAIRS = [["#2a1a12", "#4a3020"], ["#5a3418", "#7d4c26"], ["#a8642a", "#cf8a45"], ["#e2b552", "#f6d886"], ["#141016", "#2e2633"], ["#8a2a1e", "#b8452f"], ["#3d2a5e", "#5f458c"]];
const GREYS = [["#bdb9c9", "#e2dfea"], ["#8f8b9c", "#b4b0c1"]];
const SHIRTS = [["#2f6bff", "#1d48b8"], ["#e6324b", "#a51d33"], ["#20b8cc", "#127c8c"], ["#f2b51f", "#b9850f"], ["#9c2aa0", "#6c1b70"], ["#8fa31a", "#62700f"], ["#eb7f00", "#ad5c00"], ["#e8e4f2", "#b5b0c6"], ["#2b2b3a", "#16161f"]];
const BACKS = ["#2b2342", "#23304a", "#3a2338", "#20383a", "#3a3020", "#2c2a48"];
function avatarGrid(v) {
  const r = rng(hash(v.nome));
  const pick = a => a[Math.floor(r() * a.length)];
  const G = Array.from({ length: AV }, () => new Array(AV).fill(null));
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < AV && y < AV) G[y][x] = c; };
  const get = (x, y) => (x >= 0 && y >= 0 && x < AV && y < AV ? G[y][x] : null);
  const ell = (cx, cy, rx, ry, x, y) => ((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2 <= 1;
  const [sk, skM, skD] = pick(SKINS);
  const old = r() < 0.18;
  const [hr, hrL] = old ? pick(GREYS) : pick(HAIRS);
  const [sh, shD] = pick(SHIRTS);
  const style = pick(old ? ["short", "bald", "bun", "short", "side"] : ["short", "long", "bun", "long", "curly", "spiky", "side", "bob"]);
  const glasses = r() < (old ? 0.6 : 0.22);
  const beard = (style === "short" || style === "spiky" || style === "side" || style === "bald") && r() < 0.3;
  const smile = r() < 0.6;
  const blush = r() < 0.4;

  // hair behind the head
  if (style === "long") for (let y = 6; y < 27; y++) for (let x = 6; x < 26; x++) if (ell(16, 15, 10, 12.5, x, y)) set(x, y, hr);
  if (style === "bob") for (let y = 5; y < 22; y++) for (let x = 6; x < 26; x++) if (ell(16, 13, 10, 9.5, x, y)) set(x, y, hr);
  if (style === "curly") for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2; const cx = 16 + Math.cos(a) * 9.5, cy = 12 + Math.sin(a) * 9; for (let y = 0; y < 26; y++) for (let x = 0; x < AV; x++) if (cy < 15 && ell(cx, cy, 2.6, 2.6, x, y)) set(x, y, hr); }

  // shoulders and shirt
  for (let y = 25; y < AV; y++) {
    const w = 8 + (y - 25) * 1.6;
    for (let x = Math.round(16 - w); x < Math.round(16 + w); x++) set(x, y, x > 16 + w * 0.55 ? shD : sh);
  }
  // collar (V neck)
  for (let y = 25; y < 29; y++) { const w = 3 - (y - 25) * 0.75; for (let x = Math.round(16 - w); x < Math.round(16 + w); x++) set(x, y, sk); }
  set(12, 25, shD); set(19, 25, shD);
  // neck
  for (let y = 20; y < 26; y++) for (let x = 13; x < 19; x++) set(x, y, y < 22 ? skD : (x > 16 ? skM : sk));
  // head
  for (let y = 3; y < 23; y++) for (let x = 7; x < 25; x++) if (ell(16, 13, 7.6, 9.2, x, y)) set(x, y, x >= 21 ? skM : sk);
  for (let y = 3; y < 23; y++) for (let x = 7; x < 25; x++) if (ell(16, 13, 7.6, 9.2, x, y) && !ell(15.4, 12.4, 7.4, 9, x, y)) set(x, y, skM);
  // ears
  for (let y = 12; y < 16; y++) { set(7, y, skM); set(24, y, skD); }
  set(8, 13, skD); set(23, 13, skD);

  // hair on top
  const capTop = (cy, ry) => { for (let y = 1; y < 12; y++) for (let x = 6; x < 26; x++) if (ell(16, cy, 8.4, ry, x, y) && y < cy) set(x, y, hr); };
  if (style === "bald") {
    for (let y = 9; y < 15; y++) { set(8, y, hr); set(9, y, hr); set(22, y, hr); set(23, y, hr); }
  } else {
    capTop(11, 8.6);
    // fringe
    if (style === "side") for (let x = 8; x < 24; x++) { const h = Math.round(7 + (x - 8) * 0.25); for (let y = 6; y < h; y++) set(x, y, hr); }
    else if (style === "bob" || style === "long") for (let x = 9; x < 24; x++) { const h = x < 16 ? 9 : 8; for (let y = 6; y < h; y++) set(x, y, hr); }
    else for (let x = 9; x < 24; x++) set(x, 6, hr);
    // sideburns
    for (let y = 7; y < 12; y++) { set(8, y, hr); set(23, y, hr); }
    if (style === "long" || style === "bob") for (let y = 7; y < (style === "long" ? 24 : 19); y++) { set(7, y, hr); set(8, y, hr); set(23, y, hr); set(24, y, hr); }
    if (style === "bun") for (let y = 0; y < 5; y++) for (let x = 11; x < 21; x++) if (ell(16, 2.5, 3.6, 2.6, x, y)) set(x, y, hr);
    if (style === "spiky") [[9, 2], [12, 1], [15, 0], [18, 1], [21, 2]].forEach(([x, y]) => { for (let k = 0; k < 3; k++) { set(x, y + k, hr); set(x + 1, y + k, hr); } });
    // highlight
    for (let x = 11; x < 16; x++) set(x, 3, get(x, 3) === hr ? hrL : get(x, 3));
    set(10, 4, get(10, 4) === hr ? hrL : get(10, 4));
  }

  // face
  const brow = old ? hr : "#2a1a12";
  [[10, 10], [11, 10], [12, 10], [19, 10], [20, 10], [21, 10]].forEach(([x, y]) => set(x, y, style === "bald" ? skD : brow));
  // eyes: white, iris, pupil, highlight
  [[10, 12], [11, 12], [12, 12], [19, 12], [20, 12], [21, 12], [10, 13], [12, 13], [19, 13], [21, 13]].forEach(([x, y]) => set(x, y, "#ffffff"));
  [[11, 13], [20, 13]].forEach(([x, y]) => set(x, y, "#1a1222"));
  [[11, 12], [20, 12]].forEach(([x, y]) => set(x, y, "#3b2a4a"));
  set(10, 14, skM); set(11, 14, skM); set(12, 14, skM); set(19, 14, skM); set(20, 14, skM); set(21, 14, skM);
  // nose
  set(16, 14, skM); set(16, 15, skM); set(15, 16, skD); set(16, 16, skD); set(17, 16, skM);
  // cheeks
  if (blush) { set(10, 16, "#f0948a"); set(11, 16, "#f0948a"); set(20, 16, "#f0948a"); set(21, 16, "#f0948a"); }
  // mouth
  const lip = "#9a3b44";
  if (smile) { set(13, 18, lip); set(18, 18, lip); for (let x = 14; x < 18; x++) set(x, 19, lip); for (let x = 14; x < 18; x++) set(x, 18, "#ffffff"); }
  else { for (let x = 14; x < 18; x++) set(x, 19, lip); }
  // beard
  if (beard) for (let y = 17; y < 23; y++) for (let x = 8; x < 24; x++) if (ell(16, 13, 7.6, 9.2, x, y) && (y > 19 || x < 11 || x > 20) && get(x, y) !== lip) set(x, y, hr);
  // glasses
  if (glasses) {
    const gc = "#141018";
    for (let x = 9; x < 14; x++) { set(x, 11, gc); set(x, 15, gc); }
    for (let x = 18; x < 23; x++) { set(x, 11, gc); set(x, 15, gc); }
    for (let y = 11; y < 16; y++) { set(9, y, gc); set(13, y, gc); set(18, y, gc); set(22, y, gc); }
    set(14, 12, gc); set(15, 12, gc); set(16, 12, gc); set(17, 12, gc);
  }

  // outline
  const out = G.map(row => row.slice());
  for (let y = 0; y < AV; y++) for (let x = 0; x < AV; x++) {
    if (G[y][x]) continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => get(x + dx, y + dy))) out[y][x] = "#0e0a16";
  }
  return { grid: out, back: pick(BACKS) };
}
function avatarCanvas(v, cls) {
  const c = document.createElement("canvas");
  c.width = AV; c.height = AV; c.className = "avatar" + (cls ? " " + cls : "");

  c.setAttribute("aria-label", `Ritratto di ${v.nome}`);

}

/* ===================== BACKGROUND (from Boss AI) ===================== */
const bg = document.getElementById("bg"), bctx = bg.getContext("2d");
let BW = 0, BH = 0, city = [], stars = [], tick = 0;
function sizeBg() {
  BW = Math.ceil(innerWidth / 4); BH = Math.ceil(innerHeight / 4);
  bg.width = BW; bg.height = BH;
  const r = rng(42);
  city = []; stars = [];
  for (const layer of [0, 1]) {
    let x = -3;
    while (x < BW) {
      const w = 6 + Math.floor(r() * 14);
      const h = Math.floor(BH * (layer ? 0.1 + r() * 0.24 : 0.2 + r() * 0.26));
      const wins = [];
      if (layer) for (let wy = BH - h + 3; wy < BH - 2; wy += 3)
        for (let wx = x + 2; wx < x + w - 2; wx += 3)
          if (r() < 0.35) wins.push([wx, wy, r() < 0.3 ? "#ff2246" : "#ffd23f", r() * 100]);
      city.push({ layer, x, w, h, wins, ant: r() < 0.25 });
      x += w + (r() < 0.3 ? 1 : 0);
    }
  }
  for (let i = 0; i < BW * BH / 260; i++) stars.push([Math.floor(r() * BW), Math.floor(r() * BH * 0.55), r() * 100]);
}
function drawBg() {
  g = bctx;
  const bands = ["#0b0716", "#120a1d", "#1a0c22", "#250e24", "#341224", "#461522"];
  const bh = BH / bands.length;
  bands.forEach((c, i) => R(0, Math.floor(i * bh), BW, Math.ceil(bh) + 1, c));
  for (let i = 1; i < bands.length; i++) {
    const y = Math.floor(i * bh);
    for (let x = 0; x < BW; x++) { if (x % 2 === 0) P(x, y - 1, bands[i]); else P(x, y, bands[i - 1]); }
  }
  for (const [x, y, ph] of stars) if ((Math.floor(tick / 6 + ph) % 9) !== 0) P(x, y, "#5d5277");
  for (const b of city) {
    const c = b.layer ? "#07040c" : "#170e22";
    R(b.x, BH - b.h, b.w, b.h, c);
    if (b.ant) {
      R(b.x + Math.floor(b.w / 2), BH - b.h - 4, 1, 4, c);
      if (b.layer && tick % 12 < 6) P(b.x + Math.floor(b.w / 2), BH - b.h - 5, "#ff2246");
    }
    for (const [wx, wy, wc, ph] of b.wins) if ((Math.floor(tick / 8 + ph) % 13) !== 0) P(wx, wy, wc);
  }
}

    <h1 class="title">${esc(r.nome)}</h1>
    <p class="lede">${esc(r.intro)}</p>
    <div class="cards" id="cards" style="--n:${T.length}"></div>
    <div class="actions">
      <button class="btn ghost" data-act="backFromIntro">Indietro</button>
      <div class="right"><button class="btn" data-act="toQuestion">Prima domanda</button></div>
    </div>`;
  const cards = $("cards");
  T.forEach((t, i) => {
    const v = victim(i, S.ri);
    const card = document.createElement("div");
    card.className = "vcard"; card.setAttribute("style", tStyle(i));
    card.innerHTML = `<div class="team">${esc(t.name.toUpperCase())}</div><div class="who"></div><p class="sit">${esc(v.situazione)}</p>`;
    const who = card.querySelector(".who");
    who.appendChild(avatarCanvas(v));
    who.insertAdjacentHTML("beforeend", `<span class="vname">${esc(v.nome)}</span>`);
    cards.appendChild(card);
  });
}

function gridCols(n) { return `calc(var(--u) * 4.2) minmax(0, 1fr) repeat(${n}, calc(var(--u) * 17))`; }
function gridHead(T, cols) {
  return `<div class="vrow head" style="grid-template-columns:${cols}"><span></span><span></span>
    ${T.map((t, i) => `<div class="thead" style="${tStyle(i)}">${esc(t.name.toUpperCase())}<br><span style="color:var(--muted)">${t.members} PERSONE</span></div>`).join("")}
  </div>`;
}

function renderQuestion() {
  const r = ROUNDS[S.ri], d = r.domande[S.qi], T = teams(), cols = gridCols(T.length);
  panel.innerHTML = `
    <p class="eyebrow">Manche ${S.ri + 1} · ${esc(r.nome)} · domanda ${S.qi + 1} di ${r.domande.length}</p>
    <h2 class="qtext">${esc(d.q)}</h2>
    <div class="vote-grid">
      ${gridHead(T, cols)}
      ${d.options.map((o, oi) => `
        <div class="vrow" style="grid-template-columns:${cols}">
          <span class="letter">${LETTERS[oi]}</span>
          <span class="otext">${esc(o)}</span>
          ${T.map((t, ti) => `
            <div class="tcol"><div class="counter">
              <button class="step" data-act="v-" data-t="${ti}" data-o="${oi}" aria-label="Togli un voto a ${LETTERS[oi]} per ${esc(t.name)}">−</button>
              <input class="numin" type="number" inputmode="numeric" min="0" data-vt="${ti}" data-vo="${oi}" aria-label="Voti ${LETTERS[oi]} di ${esc(t.name)}">
              <button class="step" data-act="v+" data-t="${ti}" data-o="${oi}" aria-label="Aggiungi un voto a ${LETTERS[oi]} per ${esc(t.name)}">+</button>
            </div></div>`).join("")}
        </div>`).join("")}
      <div class="vrow head status-row" style="grid-template-columns:${cols}"><span></span><span></span>
        ${T.map((t, ti) => `<div class="tcol" id="st${ti}"></div>`).join("")}
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" data-act="qPrev">${S.qi === 0 ? "Torna alla manche" : "Domanda precedente"}</button>
      <div class="right"><button class="btn" data-act="confirm">Conferma risposte</button></div>
    </div>`;
  updateVotes();
}
const cell = t => S.answers[S.ri][S.qi][t];
function updateVotes() {
  teams().forEach((t, ti) => {
    const a = cell(ti), sum = a.reduce((x, y) => x + y, 0), left = t.members - sum;
    const nOpt = ROUNDS[S.ri].domande[S.qi].options.length;
    a.slice(0, nOpt).forEach((n, oi) => {
      const inp = panel.querySelector(`[data-vt="${ti}"][data-vo="${oi}"]`);
      if (document.activeElement !== inp) inp.value = n;
      panel.querySelector(`[data-act="v-"][data-t="${ti}"][data-o="${oi}"]`).disabled = n <= 0;
      panel.querySelector(`[data-act="v+"][data-t="${ti}"][data-o="${oi}"]`).disabled = left <= 0;
    });
    $("st" + ti).innerHTML = left === 0
      ? `<span class="ok">VOTI ${sum}/${t.members}<br>COMPLETI</span>`
      : `<span class="warn">VOTI ${sum}/${t.members}<br>${left} MANCANTI = SBAGLIATE</span>`;
  });
}

function renderReveal() {
  const r = ROUNDS[S.ri], d = r.domande[S.qi], T = teams(), cols = gridCols(T.length);
  const last = S.qi === r.domande.length - 1;
  panel.innerHTML = `
    <p class="eyebrow">Manche ${S.ri + 1} · ${esc(r.nome)} · domanda ${S.qi + 1} di ${r.domande.length} · risposta</p>
    <h2 class="qtext">${esc(d.q)}</h2>
    <div class="vote-grid">
      ${gridHead(T, cols)}
      ${d.options.map((o, oi) => `
        <div class="vrow ${oi === d.correct ? "right" : "wrong"}" style="grid-template-columns:${cols}">
          <span class="letter">${LETTERS[oi]}</span>
          <span class="otext">${esc(o)}</span>
          ${T.map((t, ti) => `<div class="tcol"><span class="vcount">${answersOf(ti, S.ri, S.qi)[oi]}</span></div>`).join("")}
        </div>`).join("")}
      <div class="vrow head res-row" style="grid-template-columns:${cols}"><span></span><span class="note">Risposte esatte per squadra</span>
        ${T.map((t, ti) => {
          const c = qCorrect(ti, S.ri, S.qi), p = t.members ? c / t.members * 100 : 0;
          return `<div class="tcol"><span class="res-pct">${pctTxt(p)}</span><span class="res-n">${c}/${t.members} GIUSTE</span></div>`;
        }).join("")}
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" data-act="fixVotes">Correggi i voti</button>
      <div class="right"><button class="btn" data-act="qNext">${last ? "Fine manche" : "Prossima domanda"}</button></div>
    </div>`;
}

function renderRoundResult() {
  const r = ROUNDS[S.ri], T = teams(), lastRound = S.ri === ROUNDS.length - 1;
  const rows = T.map((t, i) => ({ i, t, ...teamSummary(i, S.ri) })).sort((a, b) => b.pts - a.pts);
  panel.innerHTML = `
    <p class="eyebrow">Manche ${S.ri + 1} · ${esc(r.nome)} · risultati</p>
    <h1 class="title">Com'è andata?</h1>
    <div class="cards" id="cards" style="--n:${T.length}"></div>
    ${T.length > 1 ? `<table class="board small">
      <thead><tr><th>#</th><th>CLASSIFICA DOPO ${S.ri + 1} MANCHE</th><th class="num">PERSONE SALVATE</th><th class="num">PUNTI</th></tr></thead>
      <tbody>${rankRows(rows).map(x => `<tr class="${x.rank === 1 ? "first" : ""}" style="${tStyle(x.i)}"><td>${x.rank}</td><td class="tn">${esc(x.t.name)}</td><td class="num">${x.saved} / ${S.ri + 1}</td><td class="num">${fmt(x.pts)}</td></tr>`).join("")}</tbody>
    </table>` : ""}
    <div class="actions">
      <button class="btn ghost" data-act="backToQ">Correggi i voti</button>
      <div class="right"><button class="btn" data-act="nextRound">${lastRound ? "Classifica finale" : "Manche successiva"}</button></div>
    </div>`;
  const cards = $("cards");
  T.forEach((t, i) => {
    const v = victim(i, S.ri), s = roundScore(i, S.ri);
    const card = document.createElement("div");
    card.className = `vcard ${animCards ? "anim " : ""}${s.f.id}`;
    card.setAttribute("style", `${tStyle(i)};--bc:${BAND_COL[s.f.id] || "var(--gold)"};animation-delay:${i * 0.35}s`);
    card.innerHTML = `<div class="team">${esc(t.name.toUpperCase())}</div><div class="who"></div>
      <div class="verdict">${esc(s.f.label.toUpperCase())}</div>
      <p class="sit">${esc((r.esiti || {})[s.f.id] || "")}</p>
      <div class="calc">${s.f.mult ? `${s.base} × ${fmt(s.rm)} × ${fmt(s.f.mult)}<b>+${fmt(s.pts)} PUNTI</b>` : `${pctTxt(s.pct)} DI RISPOSTE ESATTE<b>0 PUNTI</b>`}</div>`;
    const who = card.querySelector(".who");
    who.appendChild(avatarCanvas(v));
    who.insertAdjacentHTML("beforeend", `<span class="vname">${esc(v.nome)}<br><span style="color:var(--muted);font-size:.8em">${pctTxt(s.pct)}</span></span>`);
    cards.appendChild(card);
  });
  animCards = false;
}
function rankRows(rows) {
  let rank = 0, prev = null;
  rows.forEach((r, k) => { if (r.pts !== prev) { rank = k + 1; prev = r.pts; } r.rank = rank; });
  return rows;
}

function renderFinal() {
  const rows = rankRows(teams().map((t, i) => ({ i, t, ...teamSummary(i) })).sort((a, b) => b.pts - a.pts));
  panel.innerHTML = `
    <p class="eyebrow">Fine partita</p>
    <h1 class="title cool">Classifica finale</h1>
    <table class="board">
      <thead><tr><th>#</th><th>SQUADRA</th><th class="num">PERSONE SALVATE</th><th class="num">MEDIA RISPOSTE ESATTE</th><th class="num">PUNTEGGIO</th></tr></thead>
      <tbody>${rows.map(r => `
        <tr class="${r.rank === 1 ? "first" : ""}" style="${tStyle(r.i)}">
          <td>${r.rank}</td><td class="tn">${esc(r.t.name)}</td>
          <td class="num">${r.saved} / ${ROUNDS.length}</td><td class="num">${pctTxt(r.avg)}</td><td class="num">${fmt(r.pts)}</td>
        </tr>`).join("")}</tbody>
    </table>
    <div class="actions">
      <button class="btn ghost" data-act="backToLast">Torna all'ultima manche</button>
      <div class="right"><button class="btn" data-act="toMenu">Menu</button></div>
    </div>`;
}

/* ===================== ACTIONS ===================== */
function startGame() {
  const T = S.teams.map(t => ({ name: (t.name || "").trim() || "Squadra", members: Math.max(1, t.members | 0) }));
  S = {
    phase: "intro", nTeams: S.nTeams, teams: T,
    assign: ROUNDS.map(r => shuffle(r.vittime.map((v, i) => i)).slice(0, S.nTeams)),
    answers: ROUNDS.map(r => r.domande.map(() => Array.from({ length: S.nTeams }, () => [0, 0, 0, 0]))),
    ri: 0, qi: 0, savedAt: 0
  };
  view = "game"; save(); render();
}
function go(phase, patch) { Object.assign(S, patch || {}, { phase }); save(); render(); }
function setVote(t, o, val) {
  const a = cell(t), others = a.reduce((x, y, i) => x + (i === o ? 0 : y), 0);
  a[o] = Math.max(0, Math.min(S.teams[t].members - others, val | 0));
  save(); updateVotes();
}
function toMenu() { if (view === "game" && S.phase !== "setup") save(); view = "menu"; render(); }

panel.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act, t = +b.dataset.t, o = +b.dataset.o;
  switch (act) {
    case "newGame": { const s = loadSave(); S = freshSetup(s ? s.teams.slice(0, s.nTeams) : null); view = "setup"; render(); break; }
    case "resume": { const s = unfinished(); if (s) { S = s; view = "game"; render(); } break; }
    case "toMenu": case "toMenuPause": toMenu(); break;
    case "nt-": S.nTeams = Math.max(1, S.nTeams - 1); render(); break;
    case "nt+": S.nTeams = Math.min(4, S.nTeams + 1); render(); break;
    case "m-": S.teams[t].members = Math.max(1, S.teams[t].members - 1); render(); panel.querySelector(`[data-act="m-"][data-t="${t}"]`)?.focus(); break;
    case "m+": S.teams[t].members = Math.min(200, S.teams[t].members + 1); render(); panel.querySelector(`[data-act="m+"][data-t="${t}"]`)?.focus(); break;
    case "start": startGame(); break;
    case "toRound": go("roundIntro", { ri: 0, qi: 0 }); break;
    case "backFromIntro": S.ri === 0 ? go("intro") : go("roundResult", { ri: S.ri - 1 }); break;
    case "toQuestion": go("question", { qi: 0 }); break;
    case "v+": setVote(t, o, cell(t)[o] + 1); break;
    case "v-": setVote(t, o, cell(t)[o] - 1); break;
    case "qPrev": S.qi === 0 ? go("roundIntro") : go("reveal", { qi: S.qi - 1 }); break;
    case "confirm": go("reveal"); break;
    case "fixVotes": go("question"); break;
    case "qNext":
      if (S.qi < ROUNDS[S.ri].domande.length - 1) go("question", { qi: S.qi + 1 });
      else { animCards = true; go("roundResult"); }
      break;
    case "backToQ": go("reveal", { qi: ROUNDS[S.ri].domande.length - 1 }); break;
    case "nextRound": S.ri < ROUNDS.length - 1 ? go("roundIntro", { ri: S.ri + 1, qi: 0 }) : go("final"); break;
    case "backToLast": go("roundResult", { ri: ROUNDS.length - 1 }); break;
  }
});
panel.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.name !== undefined) S.teams[+el.dataset.name].name = el.value;
});
panel.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.mem !== undefined) { S.teams[+el.dataset.mem].members = Math.max(1, Math.min(200, parseInt(el.value, 10) || 1)); render(); }
  else if (el.dataset.vt !== undefined) { setVote(+el.dataset.vt, +el.dataset.vo, parseInt(el.value, 10) || 0); el.value = cell(+el.dataset.vt)[+el.dataset.vo]; }
});
panel.addEventListener("focusin", e => { if (e.target.classList.contains("numin") && e.target.select) e.target.select(); });
panel.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("numin")) e.target.blur(); });
$("pauseBtn").addEventListener("click", toMenu);

/* ===================== LOOP ===================== */
function resize() { sizeBg(); drawBg(); }
addEventListener("resize", resize);
let last = 0;
function loop(now) {
  if (now - last >= 1000 / 12) { last = now; tick++; if (tick % 3 === 0) drawBg(); }
  requestAnimationFrame(loop);
}
window.CQ_avatar = avatarCanvas; // used by the preview tool
resize(); render();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
