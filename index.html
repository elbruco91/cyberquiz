<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyberquiz</title>
<style>
/* Fonts are bundled in /fonts so the game works offline in class.
   Jersey 10 (readable pixel font) for all text; Press Start 2P only for big titles. */
@font-face { font-family: "Jersey 10"; font-display: swap; src: url(fonts/jersey-10-latin-400-normal.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Jersey 10"; font-display: swap; src: url(fonts/jersey-10-latin-ext-400-normal.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1EFF, U+20A0-20AB, U+20AD-20C0, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Press Start 2P"; font-display: swap; src: url(fonts/press-start-2p-latin-400-normal.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Press Start 2P"; font-display: swap; src: url(fonts/press-start-2p-latin-ext-400-normal.woff2) format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+1E00-1EFF, U+20A0-20AB, U+20AD-20C0, U+2C60-2C7F, U+A720-A7FF; }

/* Arcade screen in the style of Boss AI. Sized on the viewport height so a
   whole screen (question + options + team counters) fits a 16:9 projector. */
:root {
  color-scheme: dark;
  --night: #0d0816;
  --glass: rgba(20, 13, 33, 0.93);
  --slot: #1d1530;
  --edge: #3a2f55;
  --ink: #f2eefb;
  --muted: #b3aad0;
  --blood: #ff2246;
  --volt: #3ef0ff;
  --gold: #ffd23f;
  --lime: #b6e13a;
  --green: #2fd26b;
  --orange: #ff9a2e;
  --black: #000000;
  --f-display: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --f-body: "Jersey 10", "Arial Narrow", system-ui, sans-serif;
  --u: min(1vh, 0.5625vw);   /* 1% of the height of a 16:9 frame that fits the window */
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--ink); font-family: var(--f-body); font-size: calc(var(--u) * 2.8); overflow: hidden; letter-spacing: 0.02em; }
button, input, output { font-family: var(--f-body); }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 50; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 3px); }
.app {
  position: relative; z-index: 1; height: 100%;
  display: grid; grid-template-rows: auto minmax(0, 1fr); gap: calc(var(--u) * 1.4);
  padding: calc(var(--u) * 1.6) max(calc(var(--u) * 2.4), 16px);
}
.lab { text-transform: uppercase; letter-spacing: 0.07em; }

/* ---------- HUD ---------- */
.hud {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: calc(var(--u) * 2.4);
  background: var(--glass); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--black);
  padding: calc(var(--u) * 1) calc(var(--u) * 2);
}
.game-name { font-family: var(--f-display); font-size: calc(var(--u) * 1.9); color: var(--blood); text-shadow: 3px 3px 0 var(--black); }
.game-sub { font-size: calc(var(--u) * 2.3); color: var(--muted); margin-top: calc(var(--u) * 0.4); }
.track { display: flex; justify-content: center; gap: calc(var(--u) * 3); flex-wrap: wrap; }
.trk { display: grid; gap: calc(var(--u) * 0.5); justify-items: center; }
.trk-name { font-size: calc(var(--u) * 2.1); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
.trk-name b { color: var(--gold); font-weight: 400; }
.trk.now .trk-name { color: var(--ink); }
.trk-pips { display: flex; gap: 3px; }
.trk-pip { width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); background: var(--slot); border: 2px solid var(--edge); }
.trk-pip.done { background: var(--muted); border-color: var(--black); }
.trk-pip.now { background: var(--gold); border-color: var(--black); }
.hud-btn {
  font-size: calc(var(--u) * 2.4); text-transform: uppercase; letter-spacing: 0.07em; padding: calc(var(--u) * 0.7) calc(var(--u) * 1.8); cursor: pointer;
  background: var(--slot); color: var(--ink); border: 3px solid var(--edge); box-shadow: 3px 3px 0 var(--black);
}
.hud-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--black); }
.hud-btn[hidden] { display: none; }
.app.bare .hud { display: none; }
.app.bare { grid-template-rows: minmax(0, 1fr); }

/* ---------- Panel ---------- */
.panel {
  background: var(--glass); border: 4px solid var(--edge); box-shadow: 6px 6px 0 var(--black);
  padding: calc(var(--u) * 2.6) calc(var(--u) * 3.2); display: flex; flex-direction: column; gap: calc(var(--u) * 1.8); min-height: 0; overflow: auto;
}
.eyebrow { font-size: calc(var(--u) * 2.4); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin: 0; line-height: 1.2; }
.title { font-family: var(--f-display); font-size: calc(var(--u) * 4.4); line-height: 1.15; margin: 0; color: var(--blood); text-shadow: 5px 5px 0 var(--black); text-wrap: balance; letter-spacing: 0; }
.title.cool { color: var(--volt); }
.lede { font-size: calc(var(--u) * 3.4); line-height: 1.25; margin: 0; max-width: 60em; }
.note { margin: 0; color: var(--muted); font-size: calc(var(--u) * 2.7); line-height: 1.25; }
.note strong { color: var(--gold); font-weight: 400; }
.qtext { font-size: calc(var(--u) * 4.7); line-height: 1.12; font-weight: 400; margin: 0; text-wrap: balance; }

.btn {
  font-size: calc(var(--u) * 2.9); text-transform: uppercase; letter-spacing: 0.07em; padding: calc(var(--u) * 1.1) calc(var(--u) * 2.6); cursor: pointer;
  background: var(--blood); color: var(--ink); border: 3px solid var(--black); box-shadow: 5px 5px 0 var(--black);
}
.btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--black); }
.btn.ghost { background: var(--slot); border-color: var(--edge); }
.btn.go { background: #138a45; }
.btn.big { font-size: calc(var(--u) * 3.8); padding: calc(var(--u) * 1.6) calc(var(--u) * 3.2); min-width: calc(var(--u) * 46); }
.btn:disabled { background: var(--slot); color: var(--muted); cursor: not-allowed; transform: none; box-shadow: 5px 5px 0 var(--black); }
.actions { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 1.4); flex-wrap: wrap; margin-top: auto; }
.actions .right { display: flex; gap: calc(var(--u) * 1.4); flex-wrap: wrap; margin-left: auto; align-items: center; }

.step {
  width: calc(var(--u) * 5.4); height: calc(var(--u) * 5.4); font-size: calc(var(--u) * 3.8); line-height: 1; padding: 0;
  background: var(--night); color: var(--ink); border: 3px solid var(--edge); cursor: pointer; box-shadow: 0 3px 0 var(--black); flex: none;
}
.step:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--black); }
.step:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }
.numin {
  width: calc(var(--u) * 7.4); height: calc(var(--u) * 5.4); text-align: center; font-size: calc(var(--u) * 3.9); color: var(--gold);
  background: var(--black); border: 3px solid var(--edge); padding: 0; -moz-appearance: textfield; appearance: textfield;
}
.numin::-webkit-outer-spin-button, .numin::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.numin:focus { outline: 3px solid var(--volt); outline-offset: 0; }
.counter { display: inline-flex; align-items: center; gap: calc(var(--u) * 0.5); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--volt); outline-offset: 3px; }

/* ---------- Menu ---------- */
.menu { display: grid; place-items: center; align-content: center; gap: calc(var(--u) * 3.2); text-align: center; flex: 1; }
.menu .logo { font-family: var(--f-display); font-size: calc(var(--u) * 7.2); color: var(--blood); text-shadow: 7px 7px 0 var(--black); margin: 0; line-height: 1.15; letter-spacing: 0; }
.menu .tag { font-size: calc(var(--u) * 4); color: var(--muted); margin: 0; }
.menu .faces { display: flex; gap: calc(var(--u) * 1.6); justify-content: center; }
.menu .faces .avatar { width: calc(var(--u) * 12); height: calc(var(--u) * 12); }
.menu .stack { display: grid; gap: calc(var(--u) * 1.8); justify-items: center; }
.menu .saved { font-size: calc(var(--u) * 2.8); color: var(--muted); margin: 0; }
.menu .eyebrow { font-size: calc(var(--u) * 2.6); }

/* ---------- Setup ---------- */
.setup-grid { display: grid; gap: calc(var(--u) * 2.2); flex: 1; min-height: 0; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; background: var(--slot); border: 3px solid var(--edge); padding: calc(var(--u) * 1.8) calc(var(--u) * 2.6); }
.field-label { font-size: calc(var(--u) * 4.2); }
.team-set { background: var(--slot); border: 3px solid var(--edge); border-top: calc(var(--u) * 1.4) solid var(--tc); padding: calc(var(--u) * 2.6); display: grid; gap: calc(var(--u) * 2); align-content: center; }
.team-set input[type=text] {
  width: 100%; font-size: calc(var(--u) * 4.4); color: var(--ink);
  background: var(--black); border: 3px solid var(--edge); padding: calc(var(--u) * 0.9) calc(var(--u) * 1.6);
}
.team-set .lbl { font-size: calc(var(--u) * 2.6); color: var(--ti, var(--muted)); letter-spacing: 0.07em; text-transform: uppercase; }
.team-set .row { display: flex; flex-direction: column; align-items: stretch; gap: calc(var(--u) * 1); }
.team-set .row .lbl { color: var(--muted); }
.team-set .row .counter { justify-content: space-between; gap: calc(var(--u) * 0.9); }
.team-set .row .numin, .field .numin { flex: 1; width: auto; }
.panel.setup .step { width: calc(var(--u) * 6.4); height: calc(var(--u) * 6.4); font-size: calc(var(--u) * 4.4); }
.panel.setup .numin { height: calc(var(--u) * 6.4); font-size: calc(var(--u) * 4.6); }
.field .numin { width: calc(var(--u) * 9); flex: none; display: grid; place-items: center; }
.warnline { color: var(--orange); font-size: calc(var(--u) * 2.8); margin: 0; }
.panel.setup { gap: calc(var(--u) * 2.4); padding: calc(var(--u) * 3) calc(var(--u) * 3.6); }

/* ---------- Rules ---------- */
.rules { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: calc(var(--u) * 1.6); flex: 1 0 auto; }
.rule { background: var(--slot); border: 3px solid var(--edge); border-top: calc(var(--u) * 0.9) solid var(--gold); padding: calc(var(--u) * 1.9) calc(var(--u) * 2.1); display: flex; flex-direction: column; gap: calc(var(--u) * 1.1); }
.rule h3 { font-size: calc(var(--u) * 3.2); color: var(--gold); margin: 0; line-height: 1.1; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 400; }
.rule p { margin: 0; font-size: calc(var(--u) * 2.7); line-height: 1.22; }
.rlist { margin: 0; padding-left: 1.1em; display: grid; gap: calc(var(--u) * 0.7); font-size: calc(var(--u) * 2.7); line-height: 1.18; }
.rlist li::marker { color: var(--gold); }
.emo { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; white-space: nowrap; }
.rule .num { font-family: var(--f-display); font-size: calc(var(--u) * 1.6); color: var(--muted); }
.bands { display: grid; gap: calc(var(--u) * 0.9); }
.band-row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 4px 10px; font-size: calc(var(--u) * 2.6); line-height: 1.1; }
.band-row b { font-weight: 400; color: var(--bc); text-transform: uppercase; letter-spacing: 0.04em; }
.band-row span { white-space: nowrap; color: var(--ink); }
.mults { display: grid; grid-template-columns: 1fr auto; gap: calc(var(--u) * 0.6) 10px; font-size: calc(var(--u) * 2.6); line-height: 1.1; }
.mults b { color: var(--gold); font-weight: 400; }

/* ---------- Victim cards ---------- */
.cards { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: calc(var(--u) * 1.6); }
.vcard {
  background: var(--slot); border: 3px solid var(--edge); border-top: 8px solid var(--tc);
  padding: calc(var(--u) * 2); display: grid; gap: calc(var(--u) * 1.3); align-content: start; position: relative;
}
.vcard .team { font-size: calc(var(--u) * 2.7); color: var(--ti); line-height: 1.1; text-transform: uppercase; letter-spacing: 0.06em; }
.vcard .who { display: flex; align-items: center; gap: calc(var(--u) * 1.6); }
.vcard .vname { font-size: calc(var(--u) * 3.6); line-height: 1.05; color: var(--ink); }
.vcard .vname small { display: block; color: var(--muted); font-size: 0.8em; margin-top: calc(var(--u) * 0.4); }
.vcard .sit { font-size: calc(var(--u) * 3); line-height: 1.2; margin: 0; }
.avatar { width: calc(var(--u) * 14); height: calc(var(--u) * 14); image-rendering: pixelated; border: 3px solid var(--black); flex: none; }
.verdict { font-size: calc(var(--u) * 3.4); line-height: 1.05; color: var(--bc); text-shadow: 2px 2px 0 var(--black); text-transform: uppercase; letter-spacing: 0.05em; }
.calc { font-size: calc(var(--u) * 2.6); color: var(--muted); line-height: 1.1; }
.calc b { color: var(--gold); font-weight: 400; font-size: calc(var(--u) * 4.4); display: block; margin-top: calc(var(--u) * 0.3); }
.vcard.anim { animation: dropin 0.6s steps(6) both; }
.vcard.fallito { border-color: var(--blood); border-top-color: var(--tc); }
.vcard.perfetto { box-shadow: 0 0 0 3px var(--lime); }
@keyframes dropin { from { transform: translateY(-24px); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Question grid ---------- */
.vote-grid { display: grid; gap: calc(var(--u) * 1.1); }
.vrow { display: grid; align-items: center; gap: calc(var(--u) * 1.4); background: var(--slot); border: 3px solid var(--edge); padding: calc(var(--u) * 0.8) calc(var(--u) * 1.3); }
.vrow.head { background: none; border: none; padding: 0 calc(var(--u) * 1.3); }
.letter { font-size: calc(var(--u) * 3.8); width: calc(var(--u) * 6); height: calc(var(--u) * 6); display: grid; place-items: center; background: var(--edge); }
.otext { font-size: calc(var(--u) * 3.5); line-height: 1.1; min-width: 0; }
.tcol { display: flex; justify-content: center; }
.thead { font-size: calc(var(--u) * 2.6); color: var(--ti); text-align: center; line-height: 1.05; border-bottom: 5px solid var(--tc); padding-bottom: calc(var(--u) * 0.6); overflow-wrap: anywhere; text-transform: uppercase; letter-spacing: 0.05em; }
.thead span { font-size: 0.85em; }
.status-row .tcol { font-size: calc(var(--u) * 2.3); line-height: 1.1; text-align: center; text-transform: uppercase; letter-spacing: 0.04em; }
.ok { color: var(--lime); }
.warn { color: var(--orange); }
/* reveal */
.vrow.right { background: #0f3b22; border-color: var(--green); box-shadow: 0 0 0 3px var(--green), 0 0 calc(var(--u) * 3) rgba(47, 210, 107, 0.55); animation: glow 1.2s steps(6) 2; }
.vrow.right .letter { background: var(--green); color: var(--black); }
.vrow.wrong { opacity: 0.45; }
@keyframes glow { 50% { box-shadow: 0 0 0 5px var(--green), 0 0 calc(var(--u) * 5) rgba(47, 210, 107, 0.85); } }
.vcount { font-size: calc(var(--u) * 4.4); color: var(--ink); min-width: calc(var(--u) * 6); text-align: center; }
.vrow.right .vcount { color: var(--gold); }
.res-row .tcol { display: grid; justify-items: center; gap: calc(var(--u) * 0.3); }
.res-pct { font-family: var(--f-display); font-size: calc(var(--u) * 3.4); color: var(--gold); text-shadow: 3px 3px 0 var(--black); }
.res-n { font-size: calc(var(--u) * 2.6); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* ---------- Leaderboard ---------- */
.board { width: 100%; border-collapse: separate; border-spacing: 0 calc(var(--u) * 1); font-size: calc(var(--u) * 3.8); }
.board th { font-size: calc(var(--u) * 2.4); color: var(--muted); text-align: left; padding: 0 calc(var(--u) * 1.6); font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; }
.board td { background: var(--slot); padding: calc(var(--u) * 1.3) calc(var(--u) * 1.6); border-top: 3px solid var(--edge); border-bottom: 3px solid var(--edge); line-height: 1; }
.board td:first-child { border-left: 8px solid var(--tc); font-family: var(--f-display); font-size: calc(var(--u) * 2.2); color: var(--gold); }
.board td:last-child { border-right: 3px solid var(--edge); color: var(--gold); font-size: calc(var(--u) * 4.4); }
.board .tn { color: var(--ti); }
.board .num, .board th.num { text-align: right; }
.board tr.first td { border-color: var(--gold); }
.board.small { font-size: calc(var(--u) * 3); border-spacing: 0 calc(var(--u) * 0.6); }
.board.small td { padding: calc(var(--u) * 0.7) calc(var(--u) * 1.6); }
.board.small td:last-child { font-size: calc(var(--u) * 3.4); }
.board.small td:first-child { font-size: calc(var(--u) * 1.6); }

/* result screen: cards + standings share one screen */
.panel.result { gap: calc(var(--u) * 1.4); }
.panel.result .title { display: none; }
.panel.result .eyebrow { font-size: calc(var(--u) * 3); color: var(--ink); }
.panel.result .calc { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel.result .calc b { display: inline; margin: 0; }
.panel.result .avatar { width: calc(var(--u) * 8.5); height: calc(var(--u) * 8.5); }
.panel.result .board.small td { padding: calc(var(--u) * 0.45) calc(var(--u) * 1.6); }
.panel.result .board.small { border-spacing: 0 calc(var(--u) * 0.5); }
.panel.result .vcard { gap: calc(var(--u) * 1); padding: calc(var(--u) * 1.6); }
.panel.result .sit { font-size: calc(var(--u) * 2.55); }

/* final ranking: gate, podium + table side by side, staged reveal */
.final-gate { flex: 1; display: grid; place-items: center; align-content: center; gap: calc(var(--u) * 3); text-align: center; }
.final-gate .title { font-size: calc(var(--u) * 6); }
.final-gate .lede { font-size: calc(var(--u) * 4); color: var(--muted); }
.final-wrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: calc(var(--u) * 3); align-items: stretch; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: calc(var(--u) * 1.4); min-height: calc(var(--u) * 40); padding-top: calc(var(--u) * 2); }
.pod { flex: 1; max-width: calc(var(--u) * 24); display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 0.6); height: 100%; justify-content: flex-end; }
.pod-name { font-size: calc(var(--u) * 3); color: var(--ti); text-align: center; line-height: 1; overflow-wrap: anywhere; }
.pod-pts { font-size: calc(var(--u) * 4.6); color: var(--gold); line-height: 1; text-shadow: 3px 3px 0 var(--black); }
.pod-block {
  width: 100%; display: grid; place-items: start center; padding-top: calc(var(--u) * 1.6);
  background: var(--tc); border: 4px solid var(--black);
  box-shadow: inset 0 calc(var(--u) * 1) 0 rgba(255,255,255,0.28), inset calc(var(--u) * -1) 0 0 rgba(0,0,0,0.28), 6px 6px 0 var(--black);
}
.pod-block span { font-family: var(--f-display); font-size: calc(var(--u) * 5); color: var(--black); text-shadow: 3px 3px 0 rgba(255,255,255,0.35); }
.pod.p1 .pod-block { height: 58%; }
.pod.p2 .pod-block { height: 42%; }
.pod.p3 .pod-block { height: 30%; }
.crown { width: calc(var(--u) * 9); image-rendering: pixelated; margin-bottom: calc(var(--u) * 0.4); }
.pod.win .crown { animation: bob 0.8s steps(2) infinite; }
.pod.win .pod-block { animation: flash 0.5s steps(2) 4; }
@keyframes bob { 50% { transform: translateY(calc(var(--u) * -1)); } }
@keyframes flash { 50% { filter: brightness(1.5); } }
.pod.hide { visibility: hidden; }
.pod.show { animation: rise 0.7s steps(7) both; }
@keyframes rise { from { transform: translateY(calc(var(--u) * 12)); opacity: 0; } to { transform: none; opacity: 1; } }
.board.final { align-self: end; font-size: calc(var(--u) * 3.5); }
.board.final td:last-child { font-size: calc(var(--u) * 4.2); }
.board.final tr.hide { visibility: hidden; }
.board.final tr.show { animation: slidein 0.5s steps(5) both; }
@keyframes slidein { from { transform: translateX(calc(var(--u) * 6)); opacity: 0; } to { transform: none; opacity: 1; } }
/* page transition: quick stepped pixel wipe + slide */
.panel.enter > * { animation: pageIn 0.38s steps(6) both; }
.panel.enter > *:nth-child(2) { animation-delay: 0.04s; }
.panel.enter > *:nth-child(3) { animation-delay: 0.08s; }
.panel.enter > *:nth-child(n+4) { animation-delay: 0.12s; }
@keyframes pageIn { from { opacity: 0; transform: translateY(calc(var(--u) * 2)); clip-path: inset(0 0 100% 0); } to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); } }
.hud-right { display: flex; gap: calc(var(--u) * 1); align-items: center; }
.panel { position: relative; }
.menu-fs { position: absolute; top: calc(var(--u) * 2); right: calc(var(--u) * 2); z-index: 2; }
.no-fs .fs-btn { display: none; }
@media (prefers-reduced-motion: reduce) { .panel.enter > *, .vcard.anim, .vrow.right, .pod.show, .pod.win .crown, .pod.win .pod-block, .board.final tr.show { animation: none; } }
@media (max-aspect-ratio: 4/3) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .rules, .cards, .setup-grid, .final-wrap { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="app" id="app">
  <header class="hud">
    <div>
      <div class="game-name" id="gameName"></div>
      <div class="game-sub" id="gameSub"></div>
    </div>
    <div class="track" id="track"></div>
    <div class="hud-right">
      <button class="hud-btn fs-btn" data-fs>Schermo intero</button>
      <button class="hud-btn" id="pauseBtn" hidden>Pausa</button>
    </div>
  </header>
  <main class="panel" id="panel" aria-live="polite"></main>
</div>

<script src="content.js"></script>
<script>
(() => {
"use strict";

/* ===================== CONTENT ===================== */
const C = window.CYBERQUIZ || {};
const ROUNDS = C.round || [];
const FASCE = (C.fasce || []).slice().sort((a, b) => b.min - a.min);
const LETTERS = ["A", "B", "C", "D"];
const SAVE_KEY = "cyberquiz_save_v3";
const TEAM_STYLE = [
  { name: "Squadra Viola",   col: "#9c2aa0", ink: "#dd86e3" },
  { name: "Squadra Azzurra", col: "#00b0ca", ink: "#5fdcee" },
  { name: "Squadra Gialla",  col: "#fecb00", ink: "#fecb00" },
  { name: "Squadra Lime",    col: "#a8b400", ink: "#cfdc3a" }
];
const BAND_COL = { perfetto: "var(--lime)", efficace: "var(--gold)", mid: "var(--orange)", pelo: "#ff6a3d", fallito: "var(--blood)" };

function contentErrors() {
  const e = [];
  if (ROUNDS.length < 1) e.push("Nessun round trovato in content.js.");
  ROUNDS.forEach((r, i) => {
    if ((r.vittime || []).length < 4) e.push(`Round ${i + 1}: servono 4 vittime, una per squadra.`);
    if (!(r.domande || []).length) e.push(`Round ${i + 1}: nessuna domanda.`);
    (r.domande || []).forEach((d, j) => {
      const n = (d.options || []).length;
      if (n < 2 || n > 4 || !(d.correct >= 0 && d.correct < n)) e.push(`Round ${i + 1}, domanda ${j + 1}: servono da 2 a 4 risposte e una risposta giusta valida (0 = A, 1 = B...).`);
    });
  });
  return e;
}

/* ===================== STATE & SAVE ===================== */
let S = freshSetup();
let view = "menu";           // menu | setup | game
let animCards = false;       // drop-in animation only when a round has just ended
let finalShown = false;      // final ranking stays hidden behind a button until revealed

function freshSetup(prev) {
  const teams = TEAM_STYLE.map((t, i) => ({ name: (prev && prev[i] && prev[i].name) || t.name, members: (prev && prev[i] && prev[i].members) || 25 }));
  return { phase: "setup", nTeams: prev ? prev.length : 4, teams, assign: [], answers: [], ri: 0, qi: 0, savedAt: 0 };
}
function save() {
  if (S.phase === "setup") return;
  S.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: play on */ }
}
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.teams) || !Array.isArray(s.answers) || s.answers.length !== ROUNDS.length) return null;
    for (let r = 0; r < ROUNDS.length; r++) if (!s.answers[r] || s.answers[r].length !== ROUNDS[r].domande.length) return null;
    return s;
  } catch (e) { return null; }
}
const unfinished = () => { const s = loadSave(); return s && s.phase !== "final" ? s : null; };

/* ===================== SCORING ===================== */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const teams = () => S.teams.slice(0, S.nTeams);
const victim = (t, r) => ROUNDS[r].vittime[S.assign[r][t]];
const fmt = (n, d = 2) => Number(n).toLocaleString("it-IT", { maximumFractionDigits: d });
const roundHalfUp = p => Math.floor(p + 0.5 + 1e-9);   // 85,3 → 85 · 85,5 → 86
const pctTxt = p => roundHalfUp(p) + "%";
const answersOf = (t, r, q) => S.answers[r][q][t];
const qCorrect = (t, r, q) => answersOf(t, r, q)[ROUNDS[r].domande[q].correct] || 0;
const correctVotes = (t, r) => ROUNDS[r].domande.reduce((sum, d, q) => sum + qCorrect(t, r, q), 0);
function roundPct(t, r) {
  const m = S.teams[t].members, n = ROUNDS[r].domande.length;
  return m ? Math.min(100, correctVotes(t, r) / (m * n) * 100) : 0;
}
const fasciaOf = pct => FASCE.find(f => pct >= f.min - 1e-9) || FASCE[FASCE.length - 1];
function roundScore(t, r) {
  const pct = roundPct(t, r), base = roundHalfUp(pct), f = fasciaOf(base), rm = ROUNDS[r].mult || 1;
  return { pct, base, f, rm, pts: Math.round(base * rm * f.mult) };
}
function teamSummary(t, upTo) {
  const last = upTo === undefined ? ROUNDS.length - 1 : upTo;
  let pts = 0, saved = 0, corr = 0, tot = 0;
  for (let ri = 0; ri <= last; ri++) {
    const s = roundScore(t, ri);
    pts += s.pts; if (s.f.mult > 0) saved++;
    corr += correctVotes(t, ri); tot += S.teams[t].members * ROUNDS[ri].domande.length;
  }
  return { pts, saved, avg: tot ? corr / tot * 100 : 0 };
}
const maxScore = () => ROUNDS.reduce((s, r) => s + 100 * (r.mult || 1) * (FASCE[0] ? FASCE[0].mult : 1), 0);

/* ===================== PIXEL HELPERS ===================== */
let g;
function rng(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(x, y, w, h); };
const P = (x, y, c) => R(x, y, 1, 1, c);
function hash(str) { let h = 2166136261; for (const ch of str) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }

/* ===================== AVATARS ===================== */
// 32x32 pixel portraits generated from the victim's name: shaded face, eyes with
// highlights, brows, nose, mouth, hair style, clothes with collar and a backdrop.
const AV = 32;
const SKINS = [
  ["#ffe0c4", "#f2c19e", "#d99a74"], ["#f4c8a0", "#e0a77c", "#bf8059"],
  ["#d9a275", "#c08657", "#9a643c"], ["#a8714a", "#8c5a37", "#6b4027"], ["#7a4b2f", "#633b23", "#4a2a18"]
];
const HAIRS = [["#2a1a12", "#4a3020"], ["#5a3418", "#7d4c26"], ["#a8642a", "#cf8a45"], ["#e2b552", "#f6d886"], ["#141016", "#2e2633"], ["#8a2a1e", "#b8452f"], ["#3d2a5e", "#5f458c"]];
const GREYS = [["#bdb9c9", "#e2dfea"], ["#8f8b9c", "#b4b0c1"]];
const SHIRTS = [["#2f6bff", "#1d48b8"], ["#e6324b", "#a51d33"], ["#20b8cc", "#127c8c"], ["#f2b51f", "#b9850f"], ["#9c2aa0", "#6c1b70"], ["#8fa31a", "#62700f"], ["#eb7f00", "#ad5c00"], ["#e8e4f2", "#b5b0c6"], ["#2b2b3a", "#16161f"]];
const BACKS = ["#2b2342", "#23304a", "#3a2338", "#20383a", "#3a3020", "#2c2a48"];
function avatarGrid(v) {
  const r = rng(hash(v.nome));
  const pick = a => a[Math.floor(r() * a.length)];
  const G = Array.from({ length: AV }, () => new Array(AV).fill(null));
  const set = (x, y, c) => { if (x >= 0 && y >= 0 && x < AV && y < AV) G[y][x] = c; };
  const get = (x, y) => (x >= 0 && y >= 0 && x < AV && y < AV ? G[y][x] : null);
  const ell = (cx, cy, rx, ry, x, y) => ((x + 0.5 - cx) / rx) ** 2 + ((y + 0.5 - cy) / ry) ** 2 <= 1;
  const [sk, skM, skD] = pick(SKINS);
  const old = r() < 0.18;
  const [hr, hrL] = old ? pick(GREYS) : pick(HAIRS);
  const [sh, shD] = pick(SHIRTS);
  const style = pick(old ? ["short", "bald", "bun", "short", "side"] : ["short", "long", "bun", "long", "curly", "spiky", "side", "bob"]);
  const glasses = r() < (old ? 0.6 : 0.22);
  const beard = (style === "short" || style === "spiky" || style === "side" || style === "bald") && r() < 0.3;
  const smile = r() < 0.6;
  const blush = r() < 0.4;

  // hair behind the head
  if (style === "long") for (let y = 6; y < 27; y++) for (let x = 6; x < 26; x++) if (ell(16, 15, 10, 12.5, x, y)) set(x, y, hr);
  if (style === "bob") for (let y = 5; y < 22; y++) for (let x = 6; x < 26; x++) if (ell(16, 13, 10, 9.5, x, y)) set(x, y, hr);
  if (style === "curly") for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2; const cx = 16 + Math.cos(a) * 9.5, cy = 12 + Math.sin(a) * 9; for (let y = 0; y < 26; y++) for (let x = 0; x < AV; x++) if (cy < 15 && ell(cx, cy, 2.6, 2.6, x, y)) set(x, y, hr); }

  // shoulders and shirt
  for (let y = 25; y < AV; y++) {
    const w = 8 + (y - 25) * 1.6;
    for (let x = Math.round(16 - w); x < Math.round(16 + w); x++) set(x, y, x > 16 + w * 0.55 ? shD : sh);
  }
  // collar (V neck)
  for (let y = 25; y < 29; y++) { const w = 3 - (y - 25) * 0.75; for (let x = Math.round(16 - w); x < Math.round(16 + w); x++) set(x, y, sk); }
  set(12, 25, shD); set(19, 25, shD);
  // neck
  for (let y = 20; y < 26; y++) for (let x = 13; x < 19; x++) set(x, y, y < 22 ? skD : (x > 16 ? skM : sk));
  // head
  for (let y = 3; y < 23; y++) for (let x = 7; x < 25; x++) if (ell(16, 13, 7.6, 9.2, x, y)) set(x, y, x >= 21 ? skM : sk);
  for (let y = 3; y < 23; y++) for (let x = 7; x < 25; x++) if (ell(16, 13, 7.6, 9.2, x, y) && !ell(15.4, 12.4, 7.4, 9, x, y)) set(x, y, skM);
  // ears
  for (let y = 12; y < 16; y++) { set(7, y, skM); set(24, y, skD); }
  set(8, 13, skD); set(23, 13, skD);

  // hair on top
  const capTop = (cy, ry) => { for (let y = 1; y < 12; y++) for (let x = 6; x < 26; x++) if (ell(16, cy, 8.4, ry, x, y) && y < cy) set(x, y, hr); };
  if (style === "bald") {
    for (let y = 9; y < 15; y++) { set(8, y, hr); set(9, y, hr); set(22, y, hr); set(23, y, hr); }
  } else {
    capTop(11, 8.6);
    // fringe
    if (style === "side") for (let x = 8; x < 24; x++) { const h = Math.round(7 + (x - 8) * 0.25); for (let y = 6; y < h; y++) set(x, y, hr); }
    else if (style === "bob" || style === "long") for (let x = 9; x < 24; x++) { const h = x < 16 ? 9 : 8; for (let y = 6; y < h; y++) set(x, y, hr); }
    else for (let x = 9; x < 24; x++) set(x, 6, hr);
    // sideburns
    for (let y = 7; y < 12; y++) { set(8, y, hr); set(23, y, hr); }
    if (style === "long" || style === "bob") for (let y = 7; y < (style === "long" ? 24 : 19); y++) { set(7, y, hr); set(8, y, hr); set(23, y, hr); set(24, y, hr); }
    if (style === "bun") for (let y = 0; y < 5; y++) for (let x = 11; x < 21; x++) if (ell(16, 2.5, 3.6, 2.6, x, y)) set(x, y, hr);
    if (style === "spiky") [[9, 2], [12, 1], [15, 0], [18, 1], [21, 2]].forEach(([x, y]) => { for (let k = 0; k < 3; k++) { set(x, y + k, hr); set(x + 1, y + k, hr); } });
    // highlight
    for (let x = 11; x < 16; x++) set(x, 3, get(x, 3) === hr ? hrL : get(x, 3));
    set(10, 4, get(10, 4) === hr ? hrL : get(10, 4));
  }

  // face
  const brow = old ? hr : "#2a1a12";
  [[10, 10], [11, 10], [12, 10], [19, 10], [20, 10], [21, 10]].forEach(([x, y]) => set(x, y, style === "bald" ? skD : brow));
  // eyes: white, iris, pupil, highlight
  [[10, 12], [11, 12], [12, 12], [19, 12], [20, 12], [21, 12], [10, 13], [12, 13], [19, 13], [21, 13]].forEach(([x, y]) => set(x, y, "#ffffff"));
  [[11, 13], [20, 13]].forEach(([x, y]) => set(x, y, "#1a1222"));
  [[11, 12], [20, 12]].forEach(([x, y]) => set(x, y, "#3b2a4a"));
  set(10, 14, skM); set(11, 14, skM); set(12, 14, skM); set(19, 14, skM); set(20, 14, skM); set(21, 14, skM);
  // nose
  set(16, 14, skM); set(16, 15, skM); set(15, 16, skD); set(16, 16, skD); set(17, 16, skM);
  // cheeks
  if (blush) { set(10, 16, "#f0948a"); set(11, 16, "#f0948a"); set(20, 16, "#f0948a"); set(21, 16, "#f0948a"); }
  // mouth
  const lip = "#9a3b44";
  if (smile) { set(13, 18, lip); set(18, 18, lip); for (let x = 14; x < 18; x++) set(x, 19, lip); for (let x = 14; x < 18; x++) set(x, 18, "#ffffff"); }
  else { for (let x = 14; x < 18; x++) set(x, 19, lip); }
  // beard
  if (beard) for (let y = 17; y < 23; y++) for (let x = 8; x < 24; x++) if (ell(16, 13, 7.6, 9.2, x, y) && (y > 19 || x < 11 || x > 20) && get(x, y) !== lip) set(x, y, hr);
  // glasses
  if (glasses) {
    const gc = "#141018";
    for (let x = 9; x < 14; x++) { set(x, 11, gc); set(x, 15, gc); }
    for (let x = 18; x < 23; x++) { set(x, 11, gc); set(x, 15, gc); }
    for (let y = 11; y < 16; y++) { set(9, y, gc); set(13, y, gc); set(18, y, gc); set(22, y, gc); }
    set(14, 12, gc); set(15, 12, gc); set(16, 12, gc); set(17, 12, gc);
  }

  // outline
  const out = G.map(row => row.slice());
  for (let y = 0; y < AV; y++) for (let x = 0; x < AV; x++) {
    if (G[y][x]) continue;
    if ([[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => get(x + dx, y + dy))) out[y][x] = "#0e0a16";
  }
  return { grid: out, back: pick(BACKS) };
}
function avatarCanvas(v, cls) {
  const c = document.createElement("canvas");
  c.width = AV; c.height = AV; c.className = "avatar" + (cls ? " " + cls : "");
  g = c.getContext("2d");
  const { grid, back } = avatarGrid(v);
  R(0, 0, AV, AV, back);
  for (let y = 0; y < AV; y += 2) for (let x = (y / 2) % 2 ? 1 : 0; x < AV; x += 4) P(x, y, "rgba(255,255,255,0.04)");
  grid.forEach((row, y) => row.forEach((col, x) => { if (col) P(x, y, col); }));
  c.setAttribute("role", "img");
  c.setAttribute("aria-label", `Ritratto di ${v.nome}`);
  return c;
}

/* ===================== BACKGROUND (from Boss AI) ===================== */
const bg = document.getElementById("bg"), bctx = bg.getContext("2d");
let BW = 0, BH = 0, city = [], stars = [], tick = 0;
function sizeBg() {
  BW = Math.ceil(innerWidth / 4); BH = Math.ceil(innerHeight / 4);
  bg.width = BW; bg.height = BH;
  const r = rng(42);
  city = []; stars = [];
  for (const layer of [0, 1]) {
    let x = -3;
    while (x < BW) {
      const w = 6 + Math.floor(r() * 14);
      const h = Math.floor(BH * (layer ? 0.1 + r() * 0.24 : 0.2 + r() * 0.26));
      const wins = [];
      if (layer) for (let wy = BH - h + 3; wy < BH - 2; wy += 3)
        for (let wx = x + 2; wx < x + w - 2; wx += 3)
          if (r() < 0.35) wins.push([wx, wy, r() < 0.3 ? "#ff2246" : "#ffd23f", r() * 100]);
      city.push({ layer, x, w, h, wins, ant: r() < 0.25 });
      x += w + (r() < 0.3 ? 1 : 0);
    }
  }
  for (let i = 0; i < BW * BH / 260; i++) stars.push([Math.floor(r() * BW), Math.floor(r() * BH * 0.55), r() * 100]);
}
function drawBg() {
  g = bctx;
  const bands = ["#0b0716", "#120a1d", "#1a0c22", "#250e24", "#341224", "#461522"];
  const bh = BH / bands.length;
  bands.forEach((c, i) => R(0, Math.floor(i * bh), BW, Math.ceil(bh) + 1, c));
  for (let i = 1; i < bands.length; i++) {
    const y = Math.floor(i * bh);
    for (let x = 0; x < BW; x++) { if (x % 2 === 0) P(x, y - 1, bands[i]); else P(x, y, bands[i - 1]); }
  }
  for (const [x, y, ph] of stars) if ((Math.floor(tick / 6 + ph) % 9) !== 0) P(x, y, "#5d5277");
  for (const b of city) {
    const c = b.layer ? "#07040c" : "#170e22";
    R(b.x, BH - b.h, b.w, b.h, c);
    if (b.ant) {
      R(b.x + Math.floor(b.w / 2), BH - b.h - 4, 1, 4, c);
      if (b.layer && tick % 12 < 6) P(b.x + Math.floor(b.w / 2), BH - b.h - 5, "#ff2246");
    }
    for (const [wx, wy, wc, ph] of b.wins) if ((Math.floor(tick / 8 + ph) % 13) !== 0) P(wx, wy, wc);
  }
}

/* ===================== RENDER ===================== */
const $ = id => document.getElementById(id);
const app = $("app"), panel = $("panel");
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const tStyle = t => `--tc:${TEAM_STYLE[t].col};--ti:${TEAM_STYLE[t].ink}`;
$("gameName").textContent = (C.title || "Cyberquiz").toUpperCase();
$("gameSub").textContent = C.eyebrow || "";

function renderTrack() {
  const tr = $("track");
  const inGame = view === "game" && S.phase !== "setup";
  app.classList.toggle("bare", view === "menu");
  $("pauseBtn").hidden = !inGame || S.phase === "final";
  if (!inGame) { tr.innerHTML = ""; return; }
  tr.innerHTML = ROUNDS.map((r, ri) => {
    const now = ri === S.ri && !["intro", "final"].includes(S.phase);
    const pips = r.domande.map((d, qi) => {
      let c = "";
      if (ri < S.ri || S.phase === "final" || (ri === S.ri && S.phase === "roundResult")) c = "done";
      else if (ri === S.ri && (S.phase === "question" || S.phase === "reveal")) c = qi < S.qi || (qi === S.qi && S.phase === "reveal") ? "done" : qi === S.qi ? "now" : "";
      return `<span class="trk-pip ${c}"></span>`;
    }).join("");
    return `<div class="trk${now ? " now" : ""}"><span class="trk-name">${esc(r.nome.toUpperCase())} <b>×${fmt(r.mult || 1)}</b></span><div class="trk-pips">${pips}</div></div>`;
  }).join("");
}

let lastScreen = "";
function render() {
  renderTrack();
  // page transition, only when the screen really changes (not on every vote or counter click)
  const screen = view === "game" ? [S.phase, S.ri, S.qi, finalShown].join("|") : view;
  if (screen !== lastScreen && !REDUCED) {
    panel.classList.remove("enter"); void panel.offsetWidth; panel.classList.add("enter");
  }
  lastScreen = screen;
  panel.classList.toggle("result", view === "game" && S.phase === "roundResult");
  panel.classList.toggle("setup", view === "setup" || (view === "game" && S.phase === "setup"));
  const errs = contentErrors();
  if (errs.length) {
    panel.innerHTML = `<p class="eyebrow">Errore nei contenuti</p><h1 class="title">Controlla content.js</h1>${errs.map(e => `<p class="lede">${esc(e)}</p>`).join("")}`;
    return;
  }
  if (view === "menu") return renderMenu();
  if (view === "setup" || S.phase === "setup") return renderSetup();

const cell = t => S.answers[S.ri][S.qi][t];
function updateVotes() {
  teams().forEach((t, ti) => {
    const a = cell(ti), sum = a.reduce((x, y) => x + y, 0), left = t.members - sum;
    const nOpt = ROUNDS[S.ri].domande[S.qi].options.length;
    a.slice(0, nOpt).forEach((n, oi) => {
      const inp = panel.querySelector(`[data-vt="${ti}"][data-vo="${oi}"]`);
      if (document.activeElement !== inp) inp.value = n;
      panel.querySelector(`[data-act="v-"][data-t="${ti}"][data-o="${oi}"]`).disabled = n <= 0;
      panel.querySelector(`[data-act="v+"][data-t="${ti}"][data-o="${oi}"]`).disabled = left <= 0;
    });
    $("st" + ti).innerHTML = left === 0
      ? `<span class="ok">VOTI ${sum}/${t.members}<br>COMPLETI</span>`
      : `<span class="warn">VOTI ${sum}/${t.members}<br>${left} MANCANTI = SBAGLIATE</span>`;

}

function rankRows(rows) {
  let rank = 0, prev = null;
  rows.forEach((r, k) => { if (r.pts !== prev) { rank = k + 1; prev = r.pts; } r.rank = rank; });
  return rows;
}

  const order = [1, 0, 2].filter(k => k < rows.length);           // 2nd, 1st, 3rd from left
  panel.innerHTML = `
    <p class="eyebrow">Fine partita</p>

    <div class="final-wrap">

        return `<div class="pod p${k + 1}" data-k="${k}" style="${tStyle(r.i)}">

          <span class="pod-pts"><span class="cnt" data-to="${r.pts}">0</span></span>
          <div class="pod-block"><span>${r.rank}</span></div>
        </div>`;
      }).join("")}</div>
      <table class="board final">
        <thead><tr><th>#</th><th>SQUADRA</th><th class="num">SALVATE</th><th class="num">% ESATTE</th><th class="num">PUNTI</th></tr></thead>
        <tbody>${rows.map((r, k) => `
          <tr class="${r.rank === 1 ? "first" : ""}" data-k="${k}" style="${tStyle(r.i)}">
            <td>${r.rank}</td><td class="tn">${esc(r.t.name)}</td>
            <td class="num">${r.saved} / ${ROUNDS.length}</td>
            <td class="num"><span class="cnt" data-to="${roundHalfUp(r.avg)}" data-suf="%">0%</span></td>
            <td class="num"><span class="cnt" data-to="${r.pts}">0</span></td>
          </tr>`).join("")}</tbody>
      </table>

      <button class="btn ghost" data-act="backToLast">Torna all'ultimo round</button>
      <div class="right"><button class="btn" data-act="toMenu">Menu</button></div>
    </div>`;
  // Reveal from last place to first: each table row appears and counts up;
  // the podium steps rise for 3rd, 2nd and 1st at the same moment as their row.
  const N = rows.length, STEP = REDUCED ? 0 : 1500;
  for (let k = N - 1; k >= 0; k--) {
    const delay = (N - 1 - k) * STEP;
    const els = panel.querySelectorAll(`[data-k="${k}"]`);
    els.forEach(el => {
      el.classList.add("hide");
      setTimeout(() => { el.classList.remove("hide"); el.classList.add("show"); }, delay);
      el.querySelectorAll(".cnt").forEach(c => countUp(c, { delay: delay + 250, dur: 1100 }));
    });
  }
  setTimeout(() => { const w = panel.querySelector(".pod.p1"); if (w) w.classList.add("win"); }, (N - 1) * STEP + 1400);
}
function crownSvg() {
  // 11x7 pixel crown
  const px = ["10000100001", "11001110011", "11111111111", "11111111111", "01111111110"];
  let r = "";
  px.forEach((row, y) => [...row].forEach((c, x) => { if (c === "1") r += `<rect x="${x}" y="${y + 1}" width="1" height="1"/>`; }));
  return `<svg class="crown" viewBox="0 0 11 7" shape-rendering="crispEdges" aria-hidden="true"><g fill="#ffd23f">${r}</g><rect x="5" y="3" width="1" height="1" fill="#ff2246"/><rect x="2" y="4" width="1" height="1" fill="#3ef0ff"/><rect x="8" y="4" width="1" height="1" fill="#3ef0ff"/></svg>`;
}

/* ===================== COUNTERS ===================== */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
function countUp(el, { delay = 0, dur = 1000 } = {}) {
  const to = +el.dataset.to || 0, suf = el.dataset.suf || "";
  const show = v => { el.textContent = fmt(Math.round(v)) + suf; };
  if (REDUCED || to === 0) { show(to); return; }
  show(0);
  setTimeout(() => {
    const t0 = performance.now();
    const tick = now => {
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      show(to * e);
      if (k < 1 && el.isConnected) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, delay);
}

/* ===================== ACTIONS ===================== */
function startGame() {
  const T = S.teams.map(t => ({ name: (t.name || "").trim() || "Squadra", members: Math.max(1, t.members | 0) }));
  S = {
    phase: "intro", nTeams: S.nTeams, teams: T,
    assign: ROUNDS.map(r => shuffle(r.vittime.map((v, i) => i)).slice(0, S.nTeams)),
    answers: ROUNDS.map(r => r.domande.map(() => Array.from({ length: S.nTeams }, () => [0, 0, 0, 0]))),
    ri: 0, qi: 0, savedAt: 0
  };
  view = "game"; save(); render();
}
function go(phase, patch) { Object.assign(S, patch || {}, { phase }); save(); render(); }
function setVote(t, o, val) {
  const a = cell(t), others = a.reduce((x, y, i) => x + (i === o ? 0 : y), 0);
  a[o] = Math.max(0, Math.min(S.teams[t].members - others, val | 0));
  save(); updateVotes();
}
function toMenu() { if (view === "game" && S.phase !== "setup") save(); view = "menu"; render(); }

panel.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const act = b.dataset.act, t = +b.dataset.t, o = +b.dataset.o;
  switch (act) {
    case "newGame": { const s = loadSave(); S = freshSetup(s ? s.teams.slice(0, s.nTeams) : null); view = "setup"; render(); break; }
    case "resume": { const s = unfinished(); if (s) { S = s; view = "game"; render(); } break; }
    case "toMenu": case "toMenuPause": toMenu(); break;
    case "nt-": S.nTeams = Math.max(1, S.nTeams - 1); render(); break;
    case "nt+": S.nTeams = Math.min(4, S.nTeams + 1); render(); break;
    case "m-": S.teams[t].members = Math.max(1, S.teams[t].members - 1); render(); panel.querySelector(`[data-act="m-"][data-t="${t}"]`)?.focus(); break;
    case "m+": S.teams[t].members = Math.min(200, S.teams[t].members + 1); render(); panel.querySelector(`[data-act="m+"][data-t="${t}"]`)?.focus(); break;
    case "start": startGame(); break;
    case "toRound": go("roundIntro", { ri: 0, qi: 0 }); break;
    case "backFromIntro": S.ri === 0 ? go("intro") : go("roundResult", { ri: S.ri - 1 }); break;
    case "toQuestion": go("question", { qi: 0 }); break;
    case "v+": setVote(t, o, cell(t)[o] + 1); break;
    case "v-": setVote(t, o, cell(t)[o] - 1); break;
    case "qPrev": S.qi === 0 ? go("roundIntro") : go("reveal", { qi: S.qi - 1 }); break;
    case "confirm": go("reveal"); break;
    case "fixVotes": go("question"); break;
    case "qNext":
      if (S.qi < ROUNDS[S.ri].domande.length - 1) go("question", { qi: S.qi + 1 });
      else { animCards = true; go("roundResult"); }
      break;
    case "backToQ": go("reveal", { qi: ROUNDS[S.ri].domande.length - 1 }); break;
    case "nextRound": if (S.ri < ROUNDS.length - 1) go("roundIntro", { ri: S.ri + 1, qi: 0 }); else { finalShown = false; go("final"); } break;
    case "showFinal": finalShown = true; render(); break;
    case "backToLast": go("roundResult", { ri: ROUNDS.length - 1 }); break;
  }
});
panel.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.name !== undefined) S.teams[+el.dataset.name].name = el.value;
});
panel.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.mem !== undefined) { S.teams[+el.dataset.mem].members = Math.max(1, Math.min(200, parseInt(el.value, 10) || 1)); render(); }
  else if (el.dataset.vt !== undefined) { setVote(+el.dataset.vt, +el.dataset.vo, parseInt(el.value, 10) || 0); el.value = cell(+el.dataset.vt)[+el.dataset.vo]; }
});
panel.addEventListener("focusin", e => { if (e.target.classList.contains("numin") && e.target.select) e.target.select(); });
panel.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.classList.contains("numin")) e.target.blur(); });
$("pauseBtn").addEventListener("click", toMenu);

/* ===================== FULLSCREEN ===================== */
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function toggleFullscreen() {
  const d = document.documentElement;
  if (fsEl()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (d.requestFullscreen || d.webkitRequestFullscreen).call(d).catch?.(() => {});
}
function fsLabel() { document.querySelectorAll("[data-fs]").forEach(b => { b.textContent = fsEl() ? "Esci da schermo intero" : "Schermo intero"; }); }
document.addEventListener("click", e => { if (e.target.closest("[data-fs]")) { toggleFullscreen(); } });
document.addEventListener("fullscreenchange", fsLabel);
document.addEventListener("webkitfullscreenchange", fsLabel);
// F toggles fullscreen, unless the trainer is typing in a field
addEventListener("keydown", e => {
  if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName)) toggleFullscreen();
});
const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if (!fsSupported) document.documentElement.classList.add("no-fs");

/* ===================== LOOP ===================== */
function resize() { sizeBg(); drawBg(); }
addEventListener("resize", resize);
let last = 0;
function loop(now) {
  if (now - last >= 1000 / 12) { last = now; tick++; if (tick % 3 === 0) drawBg(); }
  requestAnimationFrame(loop);
}
window.CQ_avatar = avatarCanvas; // used by the preview tool
resize(); render();
requestAnimationFrame(loop);
})();
</script>
